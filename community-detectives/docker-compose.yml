# Lokale Datenbank für die Entwicklung: `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: detectives
      POSTGRES_PASSWORD: detectives
      POSTGRES_DB: community_detectives
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
volumes:
  pgdata:
