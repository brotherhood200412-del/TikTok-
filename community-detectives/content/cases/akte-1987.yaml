# COMMUNITY DETECTIVES – Fall: Akte 1987 – Der ungelöste Fall
# Alle Personen, Orte und Unternehmen sind frei erfunden.
id: akte-1987
version: 1
title: Akte 1987 – Der ungelöste Fall
tagline: 39 Jahre lang galt Lena Haupts Tod als Unfall. Dann fällt im Kesselhaus eine Wand.
genre: coldcase
difficulty: meisterdetektiv
tier: premium
estimatedMinutes: 140
accent: "#9a6b2f"

briefing:
  location: Wendelstedt
  date: November 1987 / Oktober 2026
  intro: |
    In der Nacht zum 22. November 1987 verschwindet Lena Haupt, 19, Sängerin der Band „Nachtfalter“, nach einem Konzert im Jugendzentrum Kesselhaus. Drei Tage später wird sie im Mühlbach unterhalb des Wehrs gefunden. Die Polizei schließt den Fall nach acht Tagen: betrunken ins Wasser gestürzt, ein tragischer Unfall.
    Zwei Jahre später stürmt das Lied „Nachtfalter“ die Charts – geschrieben, so steht es auf der Platte, von Lenas Bandkollegen Michael Gerstner.
    Oktober 2026: Das Kesselhaus wird abgerissen. Hinter einer Wandverkleidung im alten Proberaum finden Bauarbeiter ein Tagebuch und eine Kassette. Die Podcasterin Nora Bach und die Cold-Case-Einheit des Landeskriminalamts öffnen die Akte noch einmal. Und ihr.
  objective: Prüft die alte Akte, wertet die neuen Funde aus, entlarvt Lügen, die 39 Jahre alt sind – und findet heraus, was in jener Nacht wirklich geschah.
  question: Wer ist für den Tod von Lena Haupt verantwortlich?

phases:
  - id: akte
    title: Die alte Akte
    goal: Lest die Akte von 1987 mit heutigen Augen. Passt der „Unfall“ zu den Befunden?
  - id: funde
    title: Die Funde im Kesselhaus
    goal: Was verraten Tagebuch, Kassette und der alte Proberaum über Lenas letzte Wochen?
  - id: luegen
    title: 39 Jahre Lügen
    goal: Wer hat damals gelogen – und warum? Prüft jedes Alibi neu.
  - id: nacht
    title: Die Nacht zum 22. November
    goal: Rekonstruiert die Nacht Minute für Minute und überführt den Täter.

characters:
  - id: lena
    name: Lena Haupt
    role: victim
    age: 19
    occupation: Sängerin und Songschreiberin der Band „Nachtfalter“ (1987)
    color: "#9a6b2f"
    profile: Talentiert, eigensinnig, wollte nach Berlin. Spitzname in der Band „Motte“. Versteckte ihre Notizen gern hinter der Wandverkleidung des Proberaums.
    personality: Mutig, idealistisch, konnte Ungerechtigkeit nicht ertragen.
    relation: Das Opfer.
    secret: Hatte herausgefunden, dass Mike Gerstner ihre Lieder unter seinem Namen angemeldet hatte, und wollte ihn nach dem Konzert zur Rede stellen.
  - id: mike
    name: Michael „Mike“ Gerstner
    role: suspect
    age: 60
    occupation: Musikproduzent (1987 Gitarrist der Band, 21)
    color: "#4f5f7a"
    profile: Bandleader und Gitarrist von „Nachtfalter“, Spitzname „Falke“. Wurde 1989 mit dem Hit „Nachtfalter“ berühmt, heute erfolgreicher Produzent. Neffe des damaligen Bürgermeisters.
    personality: Charismatisch, geschliffen, kontrolliert – nur selten blitzt Gereiztheit auf.
    relation: Bandkollege und Freund – so sagt er.
    alibi: Fuhr um 00:45 Uhr direkt nach Hause. Hat Lena nach dem Konzert nicht mehr gesehen.
    motive: Keins bekannt – er spricht bis heute „voller Liebe“ von Lena.
    secret: Hat Lenas Lieder als eigene angemeldet. Lena stellte ihn im Proberaum zur Rede; im Streit stieß er sie gegen die Kante seines Verstärkers. Sie starb. Er brachte sie in seinem Golf zum Mühlbach.
  - id: rolf
    name: Rolf Brenner
    role: suspect
    age: 63
    occupation: Dachdecker (1987 Schlagzeuger, 24)
    color: "#7a5a3c"
    profile: Lenas Freund im Jahr 1987. Damals Hauptverdächtiger. Hat bis heute den Ruf des „Mörders, dem man nichts nachweisen konnte“.
    personality: Rau, verbittert, unter der Schale tief verletzt.
    relation: Lenas damaliger Freund.
    alibi: War ab 00:30 Uhr mit Freunden im Imbiss am Markt.
    motive: Eifersucht; heftiger Streit mit Lena nach dem Konzert. Hatte sie Wochen vorher am Arm verletzt.
    secret: Hat Lena einmal grob am Arm gepackt und schämt sich seit 39 Jahren dafür. Mit ihrem Tod hat er nichts zu tun.
  - id: sabine
    name: Sabine Kaltenbach
    role: suspect
    age: 57
    occupation: Musiklehrerin (1987 Keyboarderin, 18)
    color: "#7a4f6a"
    profile: Lenas beste Freundin. War heimlich in Rolf verliebt. Hat Lena als Letzte aus dem Freundeskreis gesehen.
    personality: Leise, gewissenhaft, sehr schuldbewusst.
    relation: Beste Freundin, Bandkollegin.
    alibi: Fuhr um 00:20 Uhr mit ihrer Schwester nach Hause.
    motive: Eifersucht auf Lena wegen Rolf.
    secret: Kannte Lenas Versteck hinter der Wandverkleidung, hat es 1987 aber niemandem gesagt – aus Angst, das Tagebuch könnte ihre Gefühle für Rolf verraten.
  - id: jojo
    name: Jürgen „Jojo“ Pallas
    role: suspect
    age: 61
    occupation: Gebrauchtwagenhändler (1987 Bassist, 22)
    color: "#5a7a4f"
    profile: Bassist der Band. Verkaufte 1987 hinter dem Kesselhaus Haschisch. Lena wollte ihn deshalb aus der Band werfen.
    personality: Großspurig, ausweichend, wird kleinlaut, wenn es eng wird.
    relation: Bandkollege.
    alibi: Sei um 00:30 Uhr nach Hause gegangen.
    motive: Lena drohte, seine Geschäfte auffliegen zu lassen.
    secret: Stand bis 01:50 Uhr dealend hinter dem Kesselhaus und sah um 01:40 Uhr Mikes Golf ohne Licht vom Bandeingang Richtung Mühlweg fahren. Schwieg, um sich selbst zu schützen.
  - id: werner
    name: Werner Haupt
    role: suspect
    age: 86
    occupation: Rentner, Lenas Vater (1987 Schreinermeister, 47)
    color: "#5d5d5d"
    profile: Streng, konservativ. Verbot Lena den Umzug nach Berlin. Fuhr in der Nacht allein durch die Stadt, um sie zu suchen.
    personality: Stur, wortkarg, gebrochen.
    relation: Vater.
    alibi: Suchte seine Tochter und meldete sie auf der Wache als vermisst.
    motive: Heftiger Streit über Berlin; keine Zeugen für seine Suchfahrt.
    secret: Hat Lena an jenem Abend gesagt, sie brauche „gar nicht mehr nach Hause zu kommen“. Er hat sich das nie verziehen.
  - id: klaus
    name: Klaus Dietrich
    role: suspect
    age: 77
    occupation: Rentner (1987 Hausmeister des Kesselhauses, 38)
    color: "#6a6a4f"
    profile: Hatte alle Schlüssel des Jugendzentrums. Über ihn kursierten Gerüchte. Putzte am Sonntagmorgen den Proberaum.
    personality: Mürrisch, misstrauisch, hat sein Leben lang Angst vor Gerede.
    relation: Hausmeister.
    alibi: Schloss um 00:40 Uhr den Haupteingang ab und ging zum Stammtisch.
    motive: Gerüchte über Annäherungsversuche an junge Frauen; putzte Spuren weg.
    secret: Fand am Sonntagmorgen Blut am Verstärker im Proberaum und wischte es weg, weil er eine Schlägerei vermutete und die Schließung des Jugendzentrums fürchtete.
  - id: sommer
    name: Erich Sommer
    role: suspect
    age: 84
    occupation: Polizeihauptkommissar a. D. (1987 Ermittler, 45)
    color: "#4f6a7a"
    profile: Leitete 1987 die Ermittlungen und schloss den Fall nach acht Tagen als Unglücksfall.
    personality: Korrekt im Ton, defensiv in der Sache.
    relation: Damaliger Ermittler.
    alibi: Hatte in der Nacht Dienst auf der Wache.
    motive: Schloss den Fall auffällig schnell, ignorierte Zeugen und Spuren.
    secret: Schloss den Fall auf Weisung von Bürgermeister Helmut Gerstner – Mikes Onkel –, damit das Stadtfest nicht überschattet wird. Er wusste nicht, wen er damit schützte.
  - id: tanja
    name: Tanja Rudnik
    role: witness
    age: 56
    occupation: Krankenpflegerin (1987 Fan der Band, 17)
    color: "#6b4f8a"
    profile: War 1987 als minderjähriger Fan heimlich beim Konzert. Hat damals aus Angst vor ihren Eltern nie ausgesagt.
    personality: Nervös, ehrlich, erleichtert, endlich zu reden.
    relation: Zeugin.
    secret: Sah, wie Mike Lena um 00:25 Uhr in den Proberaum folgte.
  - id: nora
    name: Nora Bach
    role: other
    age: 34
    occupation: Podcasterin („Akte Wendelstedt“)
    color: "#2f7a6b"
    profile: Hat den Fund im Kesselhaus öffentlich gemacht und Mike Gerstner für ihren Podcast interviewt.
    personality: Hartnäckig, gründlich, fair.
    relation: Recherchiert für ihren Podcast.
    secret: Keins. Sie stellt ihre Rohaufnahmen zur Verfügung.

insights:
  - id: in_kleid_geheim
    title: Das rote Kleid war Täterwissen
    text: Die Kleidung der Toten – ein rotes Kleid – wurde 1987 bewusst nicht an die Presse gegeben. Nur wer Lena nach 00:10 Uhr sah, konnte davon wissen.
    category: spur
  - id: in_trockene_lunge
    title: Trockene Lunge
    text: Der Obduktionsbericht von 1987 vermerkt eine „auffallend trockene Lunge ohne Schaumbildung“ – und schließt trotzdem auf Ertrinken.
    category: widerspruch
  - id: in_leichenflecken
    title: Leichenflecken am Rücken
    text: Lena trieb bäuchlings im Wasser, doch die Leichenflecken sind am Rücken ausgeprägt und fixiert. Sie lag nach ihrem Tod stundenlang auf dem Rücken.
    category: widerspruch
  - id: in_kaum_alkohol
    title: Kaum Alkohol
    text: Blutalkohol 0,4 Promille. Von „betrunken ins Wasser gestürzt“ kann keine Rede sein.
    category: widerspruch
  - id: in_reifenspuren
    title: Reifenspuren am Uferweg
    text: Am Uferweg oberhalb des Wehrs sind Reifenspuren eines Pkw zu sehen. 1987 wurden sie nie ausgewertet.
    category: spur
  - id: in_tot_vor_wasser
    title: Tot, bevor sie ins Wasser kam
    text: Das Gutachten von 2026 ist eindeutig – Lena war bereits tot, als sie ins Wasser kam, und wurde nach ein bis zwei Stunden in Rückenlage dorthin gebracht.
    category: wendung
  - id: in_kante
