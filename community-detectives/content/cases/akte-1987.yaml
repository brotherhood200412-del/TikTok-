            mood: wuetend
            stress: 80
            text: "Die Band hat Lieder gemeinsam entwickelt! Lena hatte Ideen, ich habe daraus Songs gemacht. Jemand musste die Rechte sichern, sonst hätte sie irgendein Plattenboss geklaut."
          - mood: arrogant
            stress: 20
            text: "Ich. In einer einsamen Nacht im Herbst 87. Für Lena, als Erinnerung. Steht auf jeder Platte."
      - id: proberaum
        question: Wer hatte den Schlüssel zum Proberaum?
        responses:
          - mood: ruhig
            text: "Ich, als Bandleiter. Ein Vorhängeschloss, ein Schlüssel. Ich habe um Viertel vor eins abgeschlossen."
      - id: kleid
        question: Woher wissen Sie, dass Lena ein rotes Kleid trug?
        unlock: { insight: in_taeterwissen }
        responses:
          - mood: verzweifelt
            stress: 90
            text: "Ich … das stand bestimmt in der Zeitung. Oder Sabine hat es erzählt. Sie hat das Kleid geliebt, jeder wusste das. Auf der Bühne? Ich … ich habe mich vielleicht falsch erinnert."
      - id: tanja
        question: Eine Zeugin sah Sie um 00:25 Uhr in den Proberaum gehen.
        unlock: { insight: in_mike_folgt }
        responses:
          - when: { insight: in_jojo_sah_golf }
            mood: gebrochen
            stress: 100
            text: "Sie hat mich angeschrien. Sie wollte zur Zeitung, mein Onkel, meine Zukunft … Ich habe sie nur weggestoßen. Sie ist gegen den Verstärker gefallen und hat sich nicht mehr bewegt. Ich saß eine Stunde neben ihr. Dann habe ich sie zum Bach gebracht. Neununddreißig Jahre habe ich ihr Lied gesungen."
          - mood: wuetend
            stress: 85
            text: "Eine Siebzehnjährige, nachts, nach 39 Jahren? Kommen Sie. Ich war kurz drin, Kabel holen. Lena war schon weg."
      - id: jojo
        question: Warum haben Sie Jojo Pallas Geld geliehen?
        unlock: { insight: in_jojo_sah_golf }
        responses:
          - mood: nervoes
            stress: 75
            text: "Weil er ein Freund war. Ein alter Bandkollege. Man hilft sich. Was hat er Ihnen erzählt?"

  - character: rolf
    intro: Rolf Brenner sitzt in Arbeitskleidung da. Er sieht niemandem in die Augen.
    topics:
      - id: streit
        question: Worüber haben Sie mit Lena gestritten?
        responses:
          - mood: wuetend
            stress: 40
            reveals: in_streit_rolf
            text: "Berlin. Sie wollte weg, ohne mich. Ich habe rumgeschrien wie ein Idiot. Das Letzte, was ich zu ihr gesagt habe, war ‚Dann geh doch‘."
      - id: arm
        question: Sabine sagt, Sie hätten Lena einmal am Arm verletzt.
        unlock: { insight: in_streit_rolf }
        responses:
          - mood: gebrochen
            stress: 60
            text: "Ja. Einmal. Ich habe sie am Arm gepackt. Ich habe mich entschuldigt, tausendmal. Ich habe sie nie geschlagen. Aber seit 39 Jahren denkt die halbe Stadt, ich hätte sie umgebracht."
      - id: nacht
        question: Wo waren Sie nach dem Streit?
        responses:
          - mood: ruhig
            text: "Mit Henning, Paule und Tom im Imbiss am Markt. Ab halb eins bis zwei. Das hat der alte Kowalski damals alles bestätigt. Hat nur keinen interessiert."
      - id: mike
        question: Wie war Lenas Verhältnis zu Mike?
        unlock: { phase: funde }
        responses:
          - mood: ruhig
            text: "Am Ende schlecht. Sie hat gesagt, Falke klaut ihr was. Ich dachte, sie meint Gitarrensoli. Ich habe nicht zugehört. Ich habe ihr nie zugehört."

  - character: sabine
    intro: Sabine Kaltenbach hat ein altes Fotoalbum auf dem Schoß. Ihre Hände liegen darauf, als müsse sie es festhalten.
    topics:
      - id: nacht
        question: Was geschah nach dem Konzert?
        responses:
          - mood: ruhig
            text: "Lena hat sich umgezogen, in ihr rotes Kleid, für die Aftershow. Dann sagte sie, sie müsse noch mit jemandem reden, im Proberaum. Ich bin um zwanzig nach zwölf mit meiner Schwester heim. Ich hätte bleiben sollen."
      - id: versteck
        question: Hatte Lena ein Versteck?
        unlock: { phase: funde }
        responses:
          - mood: verzweifelt
            stress: 50
            text: "Hinter der Verkleidung im Proberaum. Ich wusste es. Ich habe es damals nicht gesagt, weil ich Angst hatte, was sie über mich und Rolf geschrieben hat. Es tut mir so leid."
      - id: rolf
        question: Waren Sie in Rolf verliebt?
        unlock: { insight: in_sabine_schwester }
        responses:
          - mood: verzweifelt
            stress: 40
            text: "Ja. Und ich war eifersüchtig. Aber ich habe Lena geliebt. Sie war meine beste Freundin. Ich war um halb eins längst im Bett, fragen Sie meine Schwester."
      - id: kleid
        question: Wer wusste vom roten Kleid?
        unlock: { insight: in_kleid_geheim }
        responses:
          - mood: ruhig
            text: "Nur ich – und wer sie nach zehn nach zwölf noch gesehen hat. Auf der Bühne trug sie Jeans. Die Polizei hat mir damals gesagt, ich solle über die Kleidung nicht reden. Ich habe nie darüber geredet. Mit niemandem."

  - character: jojo
    intro: Jojo Pallas sitzt breitbeinig da und dreht einen Autoschlüssel in der Hand.
    topics:
      - id: nacht
        question: Wann sind Sie in jener Nacht nach Hause gegangen?
        responses:
          - when: { insight: in_jojo_sah_golf }
            mood: gebrochen
            stress: 70
            text: "Steht alles in meiner neuen Aussage. Ich war ein Feigling. Ich hab geschwiegen, weil ich Angst um mich hatte – und dann hat Mike mir Geld geliehen, und dann war's zu spät."
          - mood: ausweichend
            stress: 40
            text: "Um halb eins. Zu Fuß. Ich war müde. Hab nichts gesehen, nichts gehört."
      - id: geschaefte
        question: Lena schrieb, Sie hätten hinter dem Kesselhaus verkauft.
        unlock: { phase: funde }
        responses:
          - mood: nervoes
            stress: 60
            text: "Das ist neununddreißig Jahre her und verjährt. Ja. Ein bisschen Gras. Lena wollte mich deshalb rauswerfen. Aber deswegen bringt man doch niemanden um!"
      - id: mike
        question: Hat Mike Ihnen je geholfen?
        unlock: { phase: luegen }
        responses:
          - mood: ausweichend
            stress: 50
            text: "Er hat mir mal Geld geliehen, für meinen ersten Autohandel. Neunzig. Zinslos. Hat nie zurückgefordert. Netter Kerl, der Mike."

  - character: werner
    intro: Werner Haupt sitzt in Lenas altem Zimmer, das seit 39 Jahren unverändert ist.
    topics:
      - id: streit
        question: Sie haben mit Lena über Berlin gestritten?
        responses:
          - mood: gebrochen
            stress: 50
            text: "Ich habe gesagt, sie braucht gar nicht mehr heimzukommen, wenn sie nach Berlin geht. Das war das Letzte, was ich zu ihr gesagt habe. Damit lebe ich."
      - id: nacht
        question: Wo waren Sie in der Nacht?
        responses:
          - mood: ruhig
            text: "Bis eins bin ich herumgefahren und habe sie gesucht. Dann bin ich zur Wache. Da saß ich bis halb drei. Der Sommer hat mich nach Hause geschickt."
      - id: kassette
        question: Lena hat Ihnen auf der Kassette etwas gewidmet.
        unlock: { insight: in_lena_autorin }
        responses:
          - mood: gebrochen
            stress: 30
            text: "„Für Papa. Auch wenn er's nicht hören will.“ … Ich will. Ich will es jeden Tag hören. Spielen Sie es noch einmal."

  - character: klaus
    intro: Klaus Dietrich hat sich die Mütze tief ins Gesicht gezogen. Er erwartet Vorwürfe.
    topics:
      - id: nacht
        question: Was haben Sie in der Nacht gemacht?
        responses:
          - mood: ruhig
            text: "Um zwanzig vor eins den Haupteingang abgeschlossen, dann in die Krone, Stammtisch bis nach drei. Den Proberaum hatte die Band. Da hatte ich keinen Schlüssel."
      - id: putzen
        question: Haben Sie am Sonntag den Proberaum geputzt?
        unlock: { phase: funde }
        responses:
          - when: { insight: in_blut_lena }
            mood: gebrochen
            stress: 80
            text: "Es war Blut. An dem großen Verstärker von dem Gerstner-Jungen. Ich dachte, da hat sich einer geprügelt. Wenn das rauskommt, machen sie das Jugendzentrum zu. Also habe ich geputzt. Ich habe es nie jemandem gesagt. Gott vergib mir."
          - mood: ausweichend
            stress: 50
            text: "Ich putze jeden Sonntag. Das ist mein Job. Da war nichts Besonderes."
      - id: geruechte
        question: Über Sie gab es damals Gerüchte.
        responses:
          - mood: wuetend
            stress: 45
            text: "Gerüchte! Weil ich geschieden war und allein gewohnt habe. Ich habe nie ein Mädchen angefasst. Aber in Wendelstedt reicht ein Gerücht für ein ganzes Leben."

  - character: sommer
    intro: Erich Sommer trägt Krawatte, obwohl er seit zwanzig Jahren pensioniert ist. Er hat die alte Akte selbst mitgebracht.
    topics:
      - id: ermittlung
        question: Warum wurde der Fall nach acht Tagen eingestellt?
        responses:
          - when: { insight: in_trockene_lunge }
            mood: nervoes
            stress: 60
            text: "Die trockene Lunge … ja. Das ist mir damals auch aufgefallen. Der Obduzent sagte, das komme vor. Und es gab … Druck. Mehr möchte ich dazu nicht sagen."
          - mood: ruhig
            stress: 20
            text: "Keine Hinweise auf Fremdverschulden, Alkohol, das Wehr. Wir hatten damals nicht die Methoden von heute."
      - id: abschluss
        question: Wer hat Druck auf Sie ausgeübt?
        unlock: { insight: in_trockene_lunge }
        responses:
          - mood: gebrochen
            stress: 75
            text: "Der Bürgermeister. Helmut Gerstner. Er rief an: Vor dem Stadtfest kein Mordgerede. Ich hatte drei Kinder und eine Beförderung in Aussicht. Ich habe mir damals eine Notiz gemacht. Hier ist sie."
      - id: hinrichs
        question: Warum wurde der Landwirt Hinrichs nie befragt?
        unlock: { insight: in_auto_muehlweg }
        responses:
          - mood: verzweifelt
            stress: 70
            text: "Weil ich es nicht durfte. Ein heller Kleinwagen mit Bandaufkleber – ich wusste, dass der Neffe des Bürgermeisters so einen fuhr. Ich habe es nicht wissen wollen."
      - id: nacht
        question: Wo waren Sie in der Nacht?
        responses:
          - mood: kooperativ
            text: "Nachtdienst auf der Wache, von zehn bis sechs. Steht im Wachbuch. Werner Haupt kam um zwanzig nach eins. Ich habe ihm Kaffee gemacht und ihn um halb drei heimgeschickt."

  - character: tanja
    intro: Tanja Rudnik ist mit dem Zug angereist. Sie hält den Brief in der Hand, den sie an den Podcast geschrieben hat.
    topics:
      - id: nacht
        question: Was haben Sie damals gesehen?
        unlock: { event: ev_tanja_schreibt }
        responses:
          - mood: verzweifelt
            stress: 40
            text: "Lena im roten Kleid, um Viertel nach zwölf. Dann Mike, kurz vor halb eins. Er hat aufgeschlossen und ist rein. Dann die Stimmen. Ich bin weggerannt. Ich war siebzehn."
      - id: sicher
        question: Sind Sie sicher, dass es Mike war?
        unlock: { event: ev_tanja_schreibt }
        responses:
          - mood: ruhig
            text: "Ich hatte ein Poster von ihm über dem Bett. Natürlich war ich sicher."

