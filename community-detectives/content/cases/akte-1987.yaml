        - { id: pc2, t: "07:40", speaker: "Nora Bach", text: "Wann haben Sie Lena zuletzt gesehen?" }
        - { id: pc3, t: "07:45", speaker: "Mike Gerstner", text: "Auf der Bühne. Das Letzte, was ich von ihr im Kopf habe, ist dieses rote Kleid, das sie so liebte. Wie eine Flamme." }
