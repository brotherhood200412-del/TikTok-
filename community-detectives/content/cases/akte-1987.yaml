        - { id: pc5, t: "15:30", speaker: "Mike Gerstner", text: "Den Proberaum habe ich um Viertel vor eins abgeschlossen. Da war niemand mehr." }
        - { id: pc6, t: "21:10", speaker: "Mike Gerstner", text: "Das mit dem Tagebuch … das ist doch dreißig Jahre her. Mädchen schreiben viel, wenn sie verletzt sind." }

