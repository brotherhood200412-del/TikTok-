  epilogue: Die Staatsanwaltschaft klagte Michael Gerstner wegen Mordes an, denn Mord verjährt nie. Das Gericht sah jedoch keine Mordmerkmale – als Totschlag war die Tat nach 39 Jahren verjährt. Freigesprochen wurde Mike nie; er verlor trotzdem alles. TONWERK trägt „Nachtfalter“ heute unter dem Namen Lena Haupt, die Erträge gehen an ihre Familie. Werner Haupt hörte die Kassette jeden Abend, bis er im Frühjahr starb. Rolf Brenner spielte auf seiner Beerdigung Schlagzeug. Das neue Jugendzentrum am Platz des Kesselhauses heißt „Lenas Haus“.
