solution:
  culprit: mike
  headline: Michael „Mike“ Gerstner – der Mann, der 39 Jahre lang Lenas Lied sang, hat sie getötet.
  motive: Mike hatte Lenas Lieder heimlich unter seinem Namen bei TONWERK angemeldet. Lena stellte ihn nach dem Konzert im Proberaum zur Rede und drohte, zur Zeitung zu gehen. Das hätte seine Karriere beendet – und seinen Onkel, den Bürgermeister, blamiert.
  method: Mike folgte Lena um 00:25 Uhr in den Proberaum. Im Streit stieß er sie, sie schlug mit dem Hinterkopf gegen die Metallecke seines Verstärkers und starb. Mike blieb über eine Stunde bei ihr – sie lag auf dem Rücken, daher die Totenflecken. Um 01:40 Uhr brachte er sie mit seinem Golf ohne Licht über den Mühlweg zum Bach und ließ sie ins Wasser gleiten, um einen Sturz am Wehr vorzutäuschen. Er schloss den Proberaum ab und gab an, um 00:45 Uhr nach Hause gefahren zu sein. Sein Onkel sorgte dafür, dass der Fall schnell geschlossen wurde; Klaus putzte das Blut weg; Jojo schwieg gegen Geld.
  summary: Schon die alte Akte widersprach dem Unfall – trockene Lunge, Totenflecken am Rücken, kaum Alkohol. Das Tagebuch nennt „Falke“, das Plakat entlarvt ihn als Mike; die Kassette beweist, dass „Nachtfalter“ Lenas Lied war. Lenas Blut klebt an seinem Verstärker. Tanja sah ihn ihr in den Proberaum folgen, Jojo und Hinrichs sahen sein Auto ohne Licht zum Bach fahren. Und im Podcast verriet er sich selbst – mit dem roten Kleid, das nur sah, wer Lena nach dem Konzert begegnete.
  keyInsights: [in_tot_vor_wasser, in_lied_von_lena, in_blut_lena, in_taeterwissen, in_mike_folgt, in_jojo_sah_golf, in_auto_mike]
  chain:
    - { insight: in_trockene_lunge, explanation: "Die trockene Lunge stand schon 1987 in der Akte – Lena ist nicht ertrunken." }
    - { insight: in_tot_vor_wasser, explanation: "Das Gutachten 2026: tot, bevor sie ins Wasser kam, und stundenlang in Rückenlage." }
    - { insight: in_falke_mike, explanation: "„Falke“ aus dem Tagebuch ist laut Plakat Mike Gerstner." }
    - { insight: in_lied_von_lena, explanation: "Die Kassette vom 3. Oktober beweist: „Nachtfalter“ war Lenas Lied – Mikes Motiv." }
    - { insight: in_blut_lena, explanation: "Lenas Blut an der Metallecke von Mikes Verstärker – der wahre Tatort war der Proberaum." }
