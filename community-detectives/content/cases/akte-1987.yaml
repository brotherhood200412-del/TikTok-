  - id: ev_tagebuch
    title: Lenas Tagebuch
    summary: Drei Einträge aus den letzten Wochen.
    source: Fund Kesselhaus
    unlock: { phase: funde }
    content:
      kind: document
      docType: diary
      heading: Tagebuch L. H., Herbst 1987
      lines:
        - { id: lt1, text: "3. Oktober. Heute „Nachtfalter“ aufgenommen, allein im Proberaum. Mein bestes Lied. Vielleicht unser Ticket nach Berlin." }
        - { id: lt2, text: "29. Oktober. Brummbär verkauft schon wieder hinterm Kesselhaus. Wenn das die Polizei mitkriegt, sind wir alle dran." }
        - { id: lt3, text: "10. November. Falke hat meine Lieder bei TONWERK angemeldet. Unter seinem Namen. Er sagt, das sei „für die Band“." }
        - { id: lt4, text: "20. November. Morgen nach dem Konzert stelle ich ihn im Proberaum zur Rede. Wenn er es nicht zurücknimmt, gehe ich zur Zeitung." }
        - { id: lt5, text: "Papa sagt, ich brauche gar nicht mehr nach Hause zu kommen, wenn ich nach Berlin gehe. Er meint es nicht so. Hoffe ich." }
    hotspots:
      - { item: lt1, insight: in_demo_datum }
      - { item: lt3, insight: in_falke_lieder }
      - { item: lt4, insight: in_konfrontation_plan }

