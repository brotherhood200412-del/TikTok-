    input:
      kind: order
      items:
        - { id: o_klirren, label: "Glas klirrt im Kabinett" }
        - { id: o_rede, label: "Hallmanns Rede beginnt" }
        - { id: o_kontrolle, label: "Kontrollgang: Bild hängt noch" }
        - { id: o_scharf, label: "Zone 3 wird wieder scharf geschaltet" }
        - { id: o_unscharf, label: "Zone 3 wird abgeschaltet" }
