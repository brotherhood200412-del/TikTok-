# COMMUNITY DETECTIVES – Fall: Der perfekte Einbruch
# Alle Personen, Orte und Unternehmen sind frei erfunden.
id: der-perfekte-einbruch
version: 1
title: Der perfekte Einbruch
tagline: Ein Fenster klirrt, ein Meisterwerk verschwindet – und niemand hat etwas gesehen.
genre: kunstdiebstahl
difficulty: einsteiger
tier: free
estimatedMinutes: 50
accent: "#b8862e"

briefing:
  location: Kunsthaus Morgenroth, Lübenau
  date: Freitag, 14. März, 21:31 Uhr
  intro: |
    Vernissage im Kunsthaus Morgenroth. Rund sechzig Gäste, Sekt, Streichquartett. Um 21:00 Uhr hält Galerist Viktor Hallmann seine Rede in der großen Halle.
    Um 21:31 Uhr bemerkt die Wachfrau Selma Okafor, dass im Kabinett nur noch ein leerer Rahmen hängt. Gestohlen wurde „Die Nachtfischer“ (Jakob Brenner, 1911) – Schätzwert 1,2 Millionen Euro.
    Das Fenster des Kabinetts ist eingeschlagen. Der Alarm hat nicht ausgelöst. Die Polizei spricht bereits vom „perfekten Einbruch“.
  objective: Findet heraus, wie der Diebstahl ablief, wer ihn begangen hat und wo das Gemälde jetzt ist.
  question: Wer hat „Die Nachtfischer“ gestohlen?

phases:
  - id: tatort
    title: Der Tatort
    goal: Untersucht das Kabinett und die Umgebung. Was stimmt am „Einbruch“ nicht?
  - id: vernehmungen
    title: Die Vernehmungen
    goal: Befragt die Anwesenden. Wer war wann wo – und wer lügt?
  - id: durchbruch
    title: Der Durchbruch
    goal: Rekonstruiert das Zeitfenster und findet das Gemälde.

characters:
  - id: hallmann
    name: Viktor Hallmann
    role: suspect
    age: 58
    occupation: Galerist, Inhaber des Kunsthauses
    color: "#7a6a4f"
    profile: Gründete das Kunsthaus vor 15 Jahren. Charmant, eitel, in der Stadt bestens vernetzt. Die Galerie steckt in finanziellen Schwierigkeiten.
    personality: Redegewandt, schnell gekränkt, hasst es, die Kontrolle zu verlieren.
    relation: Besitzer der Galerie und Leihnehmer des Gemäldes.
    alibi: Hielt von 21:00 bis 21:30 Uhr seine Rede in der großen Halle.
    motive: Versicherungsbetrug? Die Galerie hat Schulden.
    secret: Er hat vergessen, die Versicherungsprämie zu zahlen – das Bild war zum Tatzeitpunkt nicht versichert. Ein Diebstahl ruiniert ihn. Er schämt sich und verschweigt es zunächst.
  - id: okafor
    name: Selma Okafor
    role: suspect
    age: 34
    occupation: Wachfrau
    color: "#4f6a7a"
    profile: Seit 2016 im Haus, gilt als zuverlässig. Hat den Diebstahl entdeckt und die Polizei gerufen.
    personality: Ruhig, präzise, misstrauisch gegenüber Fragen zu ihrer Arbeit.
    relation: Für die Sicherheit an diesem Abend verantwortlich.
    alibi: War auf ihrer Runde, um 21:10 Uhr im Ostflügel.
    motive: Kennt Alarmanlage und Abläufe besser als jeder andere.
    secret: Sie hat in der Pause heimlich geraucht (20:40–20:50) und fürchtet, deshalb ihren Job zu verlieren. Mit dem Diebstahl hat sie nichts zu tun.
  - id: voss
    name: Lennart Voss
    role: suspect
    age: 27
    occupation: Kunststudent, Aushilfe beim Catering
    color: "#5a7a4f"
    profile: Studiert Malerei und jobbt beim Catering „Tafelwerk“. Wurde mit einer großen Mappe Richtung Hinterausgang gesehen.
    personality: Nervös, ehrgeizig, redet schnell, wenn er unsicher ist.
    relation: Kannte das Bild aus dem Studium und bewundert Brenner.
    alibi: Hat Getränke serviert und war kurz draußen am Lieferwagen.
    motive: Chronisch pleite; die Mappe war groß genug für eine Leinwand.
    secret: In der Mappe waren seine eigenen Zeichnungen. Er wollte sie Hallmann nach der Rede zeigen, verlor aber den Mut und brachte sie zum Lieferwagen.
  - id: brandauer
    name: Dr. Ilse Brandauer
    role: suspect
    age: 61
    occupation: Kunstsammlerin
    color: "#7a4f6a"
    profile: Eine der größten Privatsammlerinnen der Region. Wollte „Die Nachtfischer“ kaufen und wurde von Hallmann abgewiesen.
    personality: Kühl, scharfzüngig, gewohnt zu bekommen, was sie will.
    relation: Rivalin von Hallmann, Kaufinteressentin.
    alibi: Ist bereits vor der Rede mit dem Taxi gefahren.
    motive: Wollte das Bild unbedingt besitzen.
    secret: Sie ging früh, weil sie sich über Hallmann geärgert hatte. Sie hat mit dem Diebstahl nichts zu tun.
  - id: wendt
    name: Jonas Wendt
    role: suspect
    age: 41
    occupation: Restaurator des Kunsthauses
    color: "#4f4f7a"
    profile: Seit 2018 im Haus, arbeitet meist allein in der Werkstatt im Untergeschoss. Betreut auch Verpackung und Transporte.
    personality: Leise, pedantisch, hält sich gern im Hintergrund.
    relation: Hat das Gemälde im Herbst restauriert.
    alibi: Behauptet, um 20:30 Uhr nach Hause gegangen zu sein.
    motive: Kein offensichtliches.
    secret: Er hat das Bild gestohlen. Hallmann hatte ihm zwei Tage zuvor gekündigt; ein privater Käufer bot ihm 80.000 Euro.
  - id: roeder
    name: Annika Röder
    role: witness
    age: 45
    occupation: Architektin, Vernissage-Gast
    color: "#6a6a6a"
    profile: Stand während der Rede am Rand der großen Halle, nahe dem Gang zum Kabinett.
    personality: Aufmerksam, hilfsbereit, etwas geschwätzig.
    relation: Stammgast der Galerie.
    secret: Sagt die Wahrheit, hat aber den falschen Schluss gezogen (hält den Kellner für verdächtig).

insights:
  - id: in_hallmann_rede
    title: Die Rede beginnt
    text: Hallmanns Rede begann um 21:00 Uhr und dauerte bis 21:30 Uhr. Fast alle Gäste und Hallmann selbst waren in der großen Halle.
    category: zeitlinie
    characters: [hallmann]
    timeline: { time: "21:00", sort: 20, text: "Hallmann beginnt seine Rede in der großen Halle." }
  - id: in_bild_2058
    title: Um 20:58 hing das Bild noch
    text: Laut Wachbuch hat Selma Okafor um 20:58 Uhr das Kabinett kontrolliert – das Gemälde hing an seinem Platz.
    category: zeitlinie
    characters: [okafor]
    timeline: { time: "20:58", sort: 10, text: "Kontrollgang: Das Bild hängt noch." }
  - id: in_alarm_2108
    title: Alarm aus um 21:08 – Benutzer 04
    text: Die Alarmzone 3 (Kabinett) wurde um 21:08 Uhr mit dem Code von „Benutzer 04“ unscharf geschaltet. Kein Einbruch von außen – jemand kannte den Code.
    category: spur
    timeline: { time: "21:08", sort: 30, text: "Zone 3 (Kabinett) wird mit Code 04 abgeschaltet." }
  - id: in_klirren_2116
    title: Glas klirrt um 21:16
    text: Annika Röder hörte um 21:16 Uhr Glas klirren – während der Rede, aus Richtung Kabinett.
    category: zeitlinie
    timeline: { time: "21:16", sort: 40, text: "Glas klirrt im Kabinett." }
  - id: in_alarm_2119
    title: Alarm wieder an um 21:19
    text: Um 21:19 Uhr wurde Zone 3 mit demselben Code 04 wieder scharf geschaltet. Ein Einbrecher, der durchs Fenster flieht, schaltet keinen Alarm wieder ein – das tut nur jemand, der den Diebstahl verschleiern will.
    category: widerspruch
    timeline: { time: "21:19", sort: 50, text: "Zone 3 wird mit Code 04 wieder scharf geschaltet." }
  - id: in_wendt_2124
    title: Wendt verlässt um 21:24 das Haus
    text: Das Zutrittssystem verzeichnet um 21:24 Uhr den Mitarbeiterausweis von Jonas Wendt am Personalausgang.
    category: zeitlinie
    characters: [wendt]
    timeline: { time: "21:24", sort: 60, text: "Wendts Ausweis öffnet den Personalausgang." }
  - id: in_bild_weg_2131
    title: Entdeckung um 21:31
    text: Um 21:31 Uhr entdeckt Selma Okafor den leeren Rahmen und ruft um 21:33 Uhr die Polizei.
    category: zeitlinie
    characters: [okafor]
    timeline: { time: "21:31", sort: 70, text: "Okafor entdeckt den leeren Rahmen." }
  - id: in_von_innen
    title: Von innen eingeschlagen
    text: Die Scherben liegen draußen auf dem Gehweg, drinnen fast keine. Das Fenster wurde von innen eingeschlagen – der „Einbruch“ ist inszeniert.
    category: widerspruch
  - id: in_keine_spuren
    title: Keine Spuren im Beet
    text: Das frisch gegossene Blumenbeet unter dem Fenster ist unberührt. Niemand ist hier ein- oder ausgestiegen.
    category: spur
  - id: in_schnitt
    title: Ein Schnitt wie vom Profi
    text: Die Leinwand wurde mit einer extrem scharfen Klinge exakt am Innenrand des Keilrahmens herausgetrennt – ohne die Malschicht zu verletzen. Das war jemand mit Erfahrung.
    category: spur
  - id: in_zeitfenster
    title: Das Zeitfenster
    text: Der Diebstahl geschah zwischen 21:08 und 21:19 Uhr, während Hallmanns Rede. Der Täter kannte den Alarmcode und wusste, dass das Kabinett in dieser Zeit leer sein würde.
    category: spur
  - id: in_code04_wendt
    title: Benutzer 04 ist Jonas Wendt
    text: Benutzernummern werden in der Reihenfolge des Dienstantritts vergeben. Hallmann (2009) = 01, Sanders (2012) = 02, Okafor (2016) = 03, Wendt (2018) = 04.
    category: identitaet
    characters: [wendt]
  - id: in_wendt_luegt
    title: Wendts Alibi ist falsch
    text: Wendt behauptet, um 20:30 Uhr gegangen zu sein – sein Ausweis wurde aber erst um 21:24 Uhr am Personalausgang benutzt.
    category: widerspruch
    characters: [wendt]
  - id: in_skalpell
    title: Eine Klinge fehlt
    text: Im Skalpellset der Restaurierungswerkstatt fehlt genau eine Klinge der Stärke Nr. 11 – passend zum präzisen Schnitt am Rahmen.
    category: spur
    characters: [wendt]
  - id: in_splitter
    title: Glassplitter in der Schürze
    text: In der Tasche von Wendts Arbeitsschürze stecken feine Glassplitter – Fensterglas, wie im Kabinett.
    category: spur
    characters: [wendt]
  - id: in_kuendigung
    title: Die Kündigung
    text: Hallmann hat Wendt zwei Tage vor der Vernissage zum Monatsende gekündigt. Wendt hätte Haus und Werkstatt verlassen müssen.
    category: motiv
    characters: [wendt, hallmann]
  - id: in_kiste14
    title: Die Leinwand in Kiste K-14
    text: Transportkiste K-14 wiegt 2,1 kg mehr als angegeben. Darin, zwischen zwei Schutzpappen, liegt die aufgerollte Leinwand der „Nachtfischer“. Gepackt und abgezeichnet von J. Wendt.
    category: wendung
    characters: [wendt]
  - id: in_kaeufer
    title: Der Käufer wartet
    text: "Auf Wendts Mailbox: Ein Unbekannter bestätigt die „Abholung von Kiste vierzehn am Donnerstag“ und „den Rest der Summe nach Prüfung“."
    category: motiv
    characters: [wendt]
  - id: in_versicherung
    title: Nicht versichert
    text: Die Versicherung teilt mit, dass die Police seit dem 1. März ruht – die Prämie wurde nicht bezahlt. Hallmann bekommt keinen Cent. Für ihn ist der Diebstahl eine Katastrophe.
    category: entlastung
    characters: [hallmann]
  - id: in_mappe_harmlos
    title: Nur Zeichnungen
    text: Lennart Voss' Mappe enthält 14 eigene Kohlezeichnungen, alle signiert. Für eine Leinwand von 90 × 70 cm ist darin kein Platz – sie ist nur 60 cm breit.
    category: entlastung
    characters: [voss]
  - id: in_brandauer_weg
    title: Brandauer war längst weg
    text: "Die Taxiquittung belegt: Dr. Brandauer wurde um 20:47 Uhr vor der Galerie abgeholt und um 21:06 Uhr zu Hause abgesetzt."
    category: entlastung
    characters: [brandauer]
  - id: in_okafor_ost
    title: Okafor im Ostflügel
    text: Die Kamera im Ostflügel zeigt Selma Okafor von 21:09 bis 21:22 Uhr bei ihrer Runde. Ihr Code ist außerdem 03, nicht 04.
    category: entlastung
    characters: [okafor]

