interrogations:
  - character: hallmann
    intro: Hallmann sitzt in seinem Büro, das Sakko über der Stuhllehne. Er wirkt erschöpft – und gereizt.
    topics:
      - id: abend
        question: Wo waren Sie zwischen 21:00 und 21:30 Uhr?
        responses:
          - mood: arrogant
            text: "Am Pult, vor sechzig Zeugen! Ich habe eine halbe Stunde über Brenner gesprochen. Fragen Sie irgendwen."
      - id: versicherung
        question: Ist das Bild versichert?
        responses:
          - when: { insight: in_versicherung }
            mood: gebrochen
            stress: 70
            text: "…Sie wissen es also. Nein. Ich habe die Prämie nicht bezahlt, das Geld war einfach nicht da. Dieses Bild war eine Leihgabe. Ich muss es ersetzen. Ich bin ruiniert."
          - mood: ausweichend
            stress: 40
            text: "Selbstverständlich ist alles ordnungsgemäß geregelt. Über Versicherungsdetails spreche ich nicht mit Ihnen."
      - id: personal
        question: Gab es zuletzt Ärger mit Mitarbeitenden?
        responses:
          - mood: ruhig
            stress: 20
            text: "Ärger? Ich musste sparen. Ich habe Herrn Wendt gekündigt, zum Monatsende. Er hat es … erstaunlich gefasst aufgenommen. Die Kopie liegt in meinem Ordner, bitte."
      - id: codes
        question: Wer kennt die Alarmcodes?
        unlock: { insight: in_alarm_2108 }
        responses:
          - mood: ruhig
            text: "Nur das feste Personal. Frau Okafor, Frau Sanders aus der Buchhaltung, Herr Wendt und ich. Das Catering selbstverständlich nicht."

  - character: okafor
    intro: Selma Okafor steht mit verschränkten Armen im Wachraum. Ihre Uniform ist makellos.
    topics:
      - id: runde
        question: Wie lief Ihre Runde ab?
        responses:
          - mood: ruhig
            text: "Wie immer. 20:58 Kabinett – Bild hing, Fenster zu. Danach Ostflügel, ab 21:10 etwa, dann Westflügel. Die Kamera im Ostflügel kann das bestätigen."
      - id: alarm
        question: Warum hat der Alarm nicht ausgelöst?
        responses:
          - when: { insight: in_alarm_2108 }
            mood: nervoes
            stress: 30
            text: "Weil jemand Zone 3 mit einem gültigen Code abgeschaltet hat. Code 04. Welche Nummer wem gehört, steht im Sicherheitshandbuch. Ich gebe Ihnen die Seite."
          - mood: ausweichend
            stress: 15
            text: "Das frage ich mich auch. Die Anlage ist neu. Schauen Sie ins Protokoll. Und wenn Sie wissen wollen, wer welche Nummer hat: Das steht im Sicherheitshandbuch."
      - id: pause
        question: Haben Sie Ihren Posten an diesem Abend verlassen?
        unlock: { evidence: ev_ausgang }
        responses:
          - mood: verzweifelt
            stress: 50
            text: "…20:40 bis 20:50. Ich war draußen, eine rauchen. Das ist verboten im Dienst, ja. Aber da hing das Bild noch, ich habe es um 20:58 selbst gesehen! Bitte sagen Sie es nicht Herrn Hallmann."
      - id: code
        question: Welche Benutzernummer haben Sie?
        unlock: { insight: in_alarm_2108 }
        responses:
          - mood: kooperativ
            text: "Die 03. Ich habe heute um 18:00 scharf geschaltet und um 21:32 Überfall ausgelöst. Das war ich. Die 04 bin ich nicht."

  - character: voss
    intro: Lennart Voss knetet nervös seine Kellnerschürze. Er hat offenbar Angst.
    topics:
      - id: abend
        question: Was haben Sie während der Rede gemacht?
        responses:
          - mood: nervoes
            stress: 30
            text: "Ich … ich war kurz draußen am Lieferwagen. So von 21:13 bis 21:18 vielleicht. Mit dem Catering-Ausweis. Dann wieder Gläser einsammeln."
      - id: mappe
        question: Was war in der großen schwarzen Mappe?
        responses:
          - mood: verzweifelt
            stress: 45
            text: "Meine Zeichnungen! Ich wollte sie Herrn Hallmann zeigen, nach der Rede. Dann hab ich mich nicht getraut und sie in den Wagen gebracht. Sie können sie sehen, sie liegt noch drin!"
      - id: klirren
        question: Haben Sie das Klirren um 21:16 gehört?
        unlock: { insight: in_klirren_2116 }
        responses:
          - mood: ruhig
            text: "Um 21:16? Da war ich draußen im Hof, auf der anderen Seite, am Lieferwagen. Ich habe etwas gehört, aber es klang gedämpft … von drinnen, nicht von draußen."

  - character: brandauer
    intro: Dr. Brandauer empfängt die Ermittler in ihrem Salon. Sie bietet keinen Tee an.
    topics:
      - id: abend
        question: Wann haben Sie die Vernissage verlassen?
        responses:
          - mood: arrogant
            text: "Vor dieser unerträglichen Rede. Kurz vor neun. Ich habe ein Taxi genommen – die Quittung habe ich noch, ich hebe alles auf."
      - id: bild
        question: Sie wollten das Bild kaufen?
        responses:
          - mood: arrogant
            stress: 20
            text: "Ich habe Hallmann ein großzügiges Angebot gemacht. Er hat abgelehnt, weil es eine Leihgabe ist. Wenn ich ein Bild will, kaufe ich es. Ich stehle nicht."
      - id: wendt
        question: Kennen Sie Jonas Wendt?
        unlock: { insight: in_code04_wendt }
        responses:
          - mood: ruhig
            text: "Der Restaurator? Er hat mir vor einem Monat seine Dienste angeboten – privat, schwarz. Ich lehnte ab. Er sagte, er „wisse, wie man an Dinge kommt“. Ich hielt das für Angeberei."

  - character: wendt
    intro: Jonas Wendt sitzt aufrecht, die Hände flach auf dem Tisch. Er wirkt vorbereitet.
    topics:
      - id: abend
        question: Wo waren Sie am Abend der Vernissage?
        responses:
          - when: { insight: in_wendt_luegt }
            mood: nervoes
            stress: 60
            text: "21:24? … Gut. Ich war noch in der Werkstatt. Ich habe gearbeitet und die Zeit vergessen. Das ist kein Verbrechen."
          - mood: ruhig
            stress: 10
            text: "Zu Hause. Ich bin um halb neun gegangen. Vernissagen sind nicht meine Welt."
      - id: werkstatt
        question: Woran haben Sie in der Werkstatt gearbeitet?
        unlock: { insight: in_wendt_luegt }
        responses:
          - when: { insight: in_skalpell }
            mood: wuetend
            stress: 75
            text: "Ich … ich habe Firnis aufgetragen. Was weiß ich, wo die Klinge ist! Jeder kann in die Werkstatt gehen."
          - mood: ausweichend
            stress: 50
            text: "Firnis aufgetragen. Am Rahmen von ‚Hafen bei Nacht‘. Das braucht Ruhe."
      - id: code
        question: Wer hat Ihren Alarmcode?
        unlock: { insight: in_code04_wendt }
        responses:
          - mood: ausweichend
            stress: 55
            text: "Niemand. Aber Codes kann man ausspähen. Vielleicht hat mir jemand über die Schulter geschaut."
      - id: kuendigung
        question: Hallmann hat Ihnen gekündigt. Wie fühlen Sie sich damit?
        unlock: { insight: in_kuendigung }
        responses:
          - mood: wuetend
            stress: 60
            text: "Neun Jahre. Ich habe jedes Bild in diesem Haus gerettet. Und dann ein Zettel. ‚Aus wirtschaftlichen Gründen.‘ Wie hätten Sie sich gefühlt?"
      - id: kiste
        question: Was ist in Kiste K-14?
        unlock: { insight: in_kiste14 }
        responses:
          - when: { insight: in_splitter }
            mood: gebrochen
            stress: 100
            text: "… Die Splitter. Natürlich. Ich hätte die Schürze verbrennen sollen. Ja. Ich war es. Ich habe es nicht für das Geld getan – nicht nur. Er sollte einmal spüren, wie es ist, etwas zu verlieren."
          - mood: verzweifelt
            stress: 85
            text: "Ein Skizzenblatt. Wenn da etwas anderes drin ist, hat es jemand hineingelegt. Jeder kann an die Kisten."

