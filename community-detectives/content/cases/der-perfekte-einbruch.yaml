solution:
  culprit: wendt
  headline: Jonas Wendt – der Restaurator stahl das Bild, das er selbst gerettet hatte.
  motive: Hallmann hatte ihm zwei Tage zuvor gekündigt. Ein privater Käufer bot 80.000 Euro – und Wendt wollte Hallmann treffen, wo es weh tut.
  method: Während der Rede schaltete Wendt um 21:08 Zone 3 mit seinem eigenen Code ab, schnitt die Leinwand mit einem Skalpell (Klinge Nr. 11) aus dem Rahmen, schlug um 21:16 das Fenster von innen ein, um einen Einbruch vorzutäuschen, und schaltete den Alarm um 21:19 wieder scharf. Die Leinwand versteckte er in Transportkiste K-14, die am Donnerstag ganz offiziell das Haus verlassen sollte. Um 21:24 ging er durch den Personalausgang.
  summary: Der „perfekte Einbruch“ war gar keiner. Die Scherben lagen draußen, das Beet war unberührt, der Alarm wurde mit Code 04 aus- und wieder eingeschaltet. Code 04 gehört Wendt, der für die Tatzeit gelogen hat. Glassplitter in seiner Schürze, die fehlende Skalpellklinge und die zu schwere Kiste K-14 schließen den Fall.
  keyInsights: [in_von_innen, in_alarm_2108, in_code04_wendt, in_wendt_luegt, in_splitter, in_kiste14]
  chain:
    - { insight: in_von_innen, explanation: "Die Scherben lagen draußen – das Fenster wurde von innen eingeschlagen. Der Täter war bereits im Haus." }
    - { insight: in_alarm_2108, explanation: "Der Alarm wurde mit einem gültigen Code abgeschaltet – Benutzer 04." }
    - { insight: in_alarm_2119, explanation: "Und wieder eingeschaltet. Das tut nur jemand, der den Diebstahl verschleiern will." }
    - { insight: in_code04_wendt, explanation: "Nach Dienstantritt sortiert, ist Benutzer 04 Jonas Wendt." }
    - { insight: in_wendt_luegt, explanation: "Wendt behauptete, um 20:30 gegangen zu sein – sein Ausweis öffnete um 21:24 den Personalausgang." }
    - { insight: in_splitter, explanation: "Fensterglas in seiner Schürzentasche." }
    - { insight: in_kiste14, explanation: "Die Leinwand lag in der Kiste, die er selbst gepackt hatte." }
  truthTimeline:
    - { time: "12.03.", text: "Hallmann kündigt Wendt zum Monatsende." }
    - { time: "20:30", text: "Wendt verabschiedet sich demonstrativ – und geht hinunter in die Werkstatt." }
    - { time: "21:00", text: "Hallmanns Rede beginnt. Das Kabinett ist leer." }
    - { time: "21:08", text: "Wendt schaltet Zone 3 mit seinem Code ab und schneidet die Leinwand heraus." }
    - { time: "21:16", text: "Er schlägt die Scheibe von innen ein. Splitter fallen in seine Schürzentasche." }
    - { time: "21:19", text: "Zone 3 wieder scharf. Die Leinwand liegt aufgerollt in Kiste K-14." }
    - { time: "21:24", text: "Wendt verlässt das Haus durch den Personalausgang." }
    - { time: "21:31", text: "Okafor entdeckt den leeren Rahmen." }
