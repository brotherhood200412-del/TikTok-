interrogations:
  - character: leonie
    intro: Leonie hat Augenringe und einen Stapel ausgedruckter Screenshots dabei. Sie redet, bevor jemand fragt.
    topics:
      - id: clara
        question: Warum glauben Sie, dass die Nachrichten nicht von Clara sind?
        responses:
          - mood: wuetend
            stress: 20
            text: "Weil Clara seit Jahren „Liebe Grüße, C.“ schreibt! Und sie nennt mich Leo, niemals Leonie! Und die Unterschrift auf der Wohnungskündigung – da fehlt der Strich durchs W. Hier, ich hab ihre alten Verträge mitgebracht."
      - id: zimmer
        question: Hat Clara etwas zurückgelassen?
        responses:
          - mood: kooperativ
            text: "Ihr Tablet lag auf dem Schreibtisch. Der Kalender ist mit ihrem Handy synchronisiert. Ich hab nicht reingeschaut … okay, doch. Da steht was von Samstag."
      - id: tattoo
        question: Hat Clara Tattoos?
        unlock: { insight: in_atm_tattoo }
        responses:
          - mood: ruhig
            text: "Clara? Niemals. Sie fällt schon beim Blutabnehmen in Ohnmacht. Keine Tattoos, keine Piercings, nichts."
      - id: streit
        question: Hatten Sie Streit mit Clara?
        responses:
          - mood: verzweifelt
            stress: 40
            text: "Ja. Ich will mit meinem Freund zusammenziehen, sie war sauer wegen der Miete. Aber ich hätte doch nie ihre Wohnung gekündigt! Ich war das ganze Wochenende auf einer Hochzeit in Gerdau."

  - character: lorenz
    intro: Fabian Lorenz lehnt sich zurück, die Beine übereinandergeschlagen. Er wirkt eher besorgt als nervös.
    topics:
      - id: clara
        question: Wie war Ihr Verhältnis zu Clara?
        responses:
          - mood: kooperativ
            text: "Hervorragend. Sie ist meine beste Analystin. Sie war in letzter Zeit etwas überarbeitet – ehrlich gesagt überrascht mich so eine Auszeit nicht."
      - id: samstag
        question: Wo waren Sie am Samstagabend?
        responses:
          - when: { insight: in_auto_lorenz }
            mood: wuetend
            stress: 70
            text: "Ich war kurz am See, ja! Ich habe nach dem Haus meiner Eltern gesehen. Das ist nicht verboten. Clara habe ich dort nicht gesehen."
          - mood: ruhig
            stress: 10
            text: "Zu Hause, mit meiner Freundin Mareike. Wir haben eine Serie geschaut. Den ganzen Abend."
      - id: termin
        question: "Clara hatte einen Termin: „F. – Moorsee“. Waren Sie F.?"
        unlock: { insight: in_kalender_moorsee }
        responses:
          - mood: ausweichend
            stress: 60
            text: "F. kann jeder sein. Ihr Exfreund heißt Darius, aber vielleicht ein Freund, eine Frank, ein Florian … Ich weiß nichts von einem Termin."
      - id: konten
        question: Was sagt Ihnen das Kürzel FLZ auf 80 verdächtigen Konten?
        unlock: { insight: in_konten_lorenz }
        responses:
          - when: { insight: in_clara_gefunden }
            mood: gebrochen
            stress: 100
            text: "Sie haben sie gefunden? … Gott sei Dank. Ich wollte ihr nichts tun. Ich wollte nur Zeit. Zwei Wochen, bis alles verschoben ist. Mareike sollte nur so tun, als wäre sie weg. Es ist alles außer Kontrolle geraten."
          - mood: arrogant
            stress: 85
            text: "Meine Kennung wird vom halben Team benutzt. Passwörter kleben bei uns an jedem Bildschirm. Das beweist gar nichts."
      - id: wochenendhaus
        question: Wem gehört das Haus Seeweg 7?
        unlock: { insight: in_wochenendhaus }
        responses:
          - mood: nervoes
            stress: 75
            text: "Meinen Eltern. Sie sind in Spanien. Ich habe den Schlüssel, ja. Wollen Sie etwa da rein? Dafür brauchen Sie einen Beschluss."

  - character: mareike
    intro: Mareike Sauer zieht die Ärmel ihres Pullovers über die Hände. Sie sieht immer wieder zur Tür.
    topics:
      - id: samstag
        question: Wo waren Sie am Samstagabend?
        responses:
          - mood: nervoes
            stress: 30
            text: "Bei Fabian. Auf dem Sofa. Serie. Das hat er doch schon gesagt."
      - id: sonntag
        question: Und am Sonntag?
        responses:
          - mood: ausweichend
            stress: 45
            text: "Mein Salon hat sonntags zu. Ich war … spazieren. Allein. Am Markt in Nord, glaube ich."
      - id: clara
        question: Kennen Sie Clara Weiß?
        responses:
          - mood: ausweichend
            stress: 30
            text: "Flüchtig. Von der Weihnachtsfeier. Sie hat … ähnliche Haare wie ich. Das hat sie mal gesagt."
      - id: tattoo
        question: Zeigen Sie uns bitte Ihr linkes Handgelenk.
        unlock: { insight: in_tattoo_mareike }
        responses:
          - when: { insight: in_clara_gefunden }
            mood: gebrochen
            stress: 100
            text: "Sie lebt? Gott sei Dank. … Fabian hat gesagt, sie sei nur im Haus, sie bekomme Essen, das sei nur für zwei Wochen. Ich habe das Geld abgehoben, das Foto gemacht, die Briefe geschrieben. Ich wollte nie, dass ihr etwas passiert."
          - mood: verzweifelt
            stress: 90
            text: "Viele Frauen haben Schwalben-Tattoos! … Ich sage nichts mehr ohne Anwalt."
      - id: handy
        question: Welches Handy benutzen Sie?
        unlock: { evidence: ev_profil }
        responses:
          - mood: nervoes
            stress: 50
            text: "Ein Orbis. Den S9. Warum? Den haben doch tausend Leute."

  - character: jonas
    intro: Jonas Weiß knetet seine Mütze. Er sieht aus, als habe er seit Tagen nicht geschlafen.
    topics:
      - id: geld
        question: Warum hat Clara Ihnen 2.000 Euro überwiesen?
        unlock: { insight: in_ueberweisung_jonas }
        responses:
          - mood: verzweifelt
            stress: 60
            text: "Ich weiß es nicht! Ich habe nicht gefragt. Ich dachte, sie will mir helfen, wie immer. Ich hab's ausgegeben, für Schulden. Ich hätte es melden müssen, ich weiß."
      - id: samstag
        question: Wo waren Sie am Samstag?
        responses:
          - mood: ruhig
            text: "Nachtschicht im Lager, Hafenau-Ost. Von sechs bis nach zwei. Stempelkarte, Kollegen, alles."
      - id: schwester
        question: Wann haben Sie Clara zuletzt gesprochen?
        responses:
          - mood: kooperativ
            text: "Donnerstag. Sie war komisch. Sie hat gesagt, sie hat bei der Arbeit was gefunden, das „ganz oben einschlagen“ wird. Und dass ihr Chef sie zum Reden eingeladen hat."

  - character: darius
    intro: Darius trägt einen Hoodie mit Teamlogo und kaut Kaugummi. Er gibt sich gelangweilt.
    topics:
      - id: drohung
        question: "Sie schrieben Clara: „Du wirst es noch bereuen.“"
        responses:
          - mood: arrogant
            stress: 40
            text: "Ja, war dumm. Ich meinte, sie bereut die Trennung. Nicht dass ich ihr was tu. Ich bin kein Psycho."
      - id: samstag
        question: Wo waren Sie am Samstagabend?
        responses:
          - mood: arrogant
            text: "Live. Turnier, sechs Stunden, mit Facecam. Zwölftausend Leute haben mir zugeguckt. Besseres Alibi gibt's nicht."
      - id: lorenz
        question: Kennen Sie Fabian Lorenz?
        responses:
          - mood: ruhig
            text: "Ihren Chef? Den Schönling? Clara hat mal erzählt, dass er ihr zu nett ist. Und dass seine Freundin bei der Weihnachtsfeier dauernd ihre Frisur kopieren wollte."

  - character: ostermann
    intro: Dr. Ostermann kommt direkt vom Flughafen. Sie hat ihren Anwalt am Telefon.
    topics:
      - id: clara
        question: Hat Clara Sie kontaktiert?
        responses:
          - mood: ausweichend
            stress: 40
            text: "Ich bekomme zweihundert Mails am Tag. Ich war in Oslo. Lassen Sie mich nachsehen … Freitag, 17:02. Ungelesen. Mein Gott."
      - id: novapay
        question: Wir brauchen Unterlagen aus Ihrem Unternehmen.
        responses:
          - mood: kooperativ
            text: "Sie bekommen alles. Fuhrpark, Zugriffsprotokolle, was Sie wollen. Wenn in meinem Haus jemand betrügt, will ich es vor der Börsenaufsicht wissen."
      - id: lorenz
        question: Was halten Sie von Fabian Lorenz?
        unlock: { insight: in_mail_ostermann }
        responses:
          - mood: ruhig
            text: "Unser Wunderkind. Seine Abteilung hat die Neukundenzahl verdreifacht. Ich habe nie gefragt, wie. Das war wohl ein Fehler."

puzzles:
  - id: p_echt
    title: Echt oder gefälscht?
    type: contradiction
    prompt: Welche dieser Nachrichten hat Clara mit Sicherheit NICHT selbst geschrieben?
    evidence: [ev_nachrichten_leonie, ev_kuendigung_mail, ev_mail_ostermann]
    unlock: { insight: in_signatur_clara }
    input:
      kind: choice
      options:
        - { id: m_pizza, label: "„Leo, ich bring Pizza mit.“ (Dienstag)" }
        - { id: m_karton, label: "„Wenn was ist: Schuhkarton.“ (Freitag)" }
        - { id: m_kuendigung, label: "„Danke an Herrn Lorentz für alles! LG Clara“ (Kündigungsmail)" }
        - { id: m_chaos, label: "„Riesenchaos auf Arbeit.“ (Donnerstag)" }
    answer: { choice: m_kuendigung }
    hints:
      - Wie unterschreibt Clara? Wie nennt sie Leonie?
      - Achtet auch auf die Schreibweise des Namens ihres eigenen Chefs.
    reveals: [in_mail_gefaelscht]
    success: "„LG Clara“ statt „Liebe Grüße, C.“ – und den Namen ihres eigenen Chefs hätte Clara nie falsch geschrieben."

  - id: p_foto
