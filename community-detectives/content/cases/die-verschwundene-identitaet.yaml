        - { id: w_novapay, label: "Im Archiv von Novapay" }
        - { id: w_seeweg9, label: "Im Bootshaus des Segelclubs, Seeweg 9" }
    answer: { choice: w_seeweg7 }
    hints:
      - Wo hat sich Claras Handy zuletzt eingewählt – und wem gehört dort ein Haus?
      - Das Kalenderkürzel „F.“, das Ladeprotokoll und das Grundbuch zeigen auf dieselbe Familie.
    reveals: [in_ort_clara]
