events:
  - id: ev_bank_meldet
    title: Die Sparkasse meldet sich
    source: Sparkasse Hafenau
    text: "Die Bank hat nach der Vermisstenmeldung das Konto überprüft: „Es gab am Sonntag eine Barabhebung und eine Überweisung. Wir schicken Ihnen das Kamerabild vom Automaten.“"
    trigger: { minutes: 12 }
  - id: ev_zugriff
    title: Zugriff am Moorsee
    source: Polizei Hafenau
    text: Ein Spezialeinsatzkommando öffnet um 21:12 Uhr das Wochenendhaus Seeweg 7. Im Keller finden die Beamten eine Frau, schwach, aber ansprechbar. Es ist Clara Weiß. Ein Notarzt bringt sie ins Krankenhaus. Sie ist noch zu benommen, um auszusagen.
    trigger: { when: { insight: in_ort_clara } }
    reveals: [in_clara_gefunden]
  - id: ev_jonas_meldet
