solution:
  culprit: lorenz
  accomplices: [mareike]
  headline: Fabian Lorenz ließ Clara verschwinden – und seine Freundin Mareike lebte ihr Leben weiter.
  motive: Clara hatte entdeckt, dass Lorenz über 80 Konten mit gestohlenen Identitäten Geld wusch. Sie wollte es am Montag der Vorstandschefin zeigen. Lorenz brauchte Zeit, um das Geld zu verschieben und die Spuren zu löschen.
  method: Lorenz lud Clara für Samstag 18:30 Uhr „zum Reden“ ins Wochenendhaus seiner Eltern am Moorsee ein. Er fuhr mit dem Dienstwagen hin (Ladesäule 18:55), betäubte sie, schaltete ihr Handy aus und sperrte sie in den Keller. Ihren Laptop zerstörte er. Ab Sonntag gab sich Mareike, die Clara ähnelt, als sie aus – Abhebung am Automaten, Überweisung an den Bruder, das „Lissabon“-Foto aus einem Hafenauer Café, die Kündigungen. Clara sollte als freiwillig untergetaucht gelten.
  summary: Kein Lebenszeichen seit Sonntag stammte von Clara – falsche Grußformel, falscher Name des Chefs, ein Foto mit dem Hafenauer Fernsehturm und eine Linkshänderin mit Schwalben-Tattoo am Geldautomaten. Claras Kalender, ihr letzter Handy-Kontakt, Lorenz' Dienstwagen und das Grundbuch führten zum Seeweg 7 – wo die Polizei Clara lebend fand. Ihre Liste beweist das Motiv.
  keyInsights: [in_mail_gefaelscht, in_tattoo_mareike, in_kalender_moorsee, in_auto_lorenz, in_konten_lorenz, in_clara_gefunden]
  chain:
    - { insight: in_mail_gefaelscht, explanation: "Die Nachrichten seit Sonntag waren nicht von Clara – jemand lebte ihr Leben weiter." }
    - { insight: in_foto_hafenau, explanation: "Das „Lissabon“-Foto entstand in Hafenau." }
    - { insight: in_tattoo_mareike, explanation: "Die Frau am Geldautomaten trug Mareikes Schwalben-Tattoo." }
    - { insight: in_kalender_moorsee, explanation: "Claras letzter Termin: „F. – Moorsee, reden“." }
    - { insight: in_auto_lorenz, explanation: "Lorenz' Dienstwagen lud um 18:55 am Moorsee – sein Alibi war falsch." }
    - { insight: in_konten_lorenz, explanation: "Claras Liste: 80 Betrugskonten, alle angelegt von FLZ." }
    - { insight: in_clara_gefunden, explanation: "Clara war im Keller des Lorenz-Hauses am Seeweg 7." }
  truthTimeline:
    - { time: "Do", text: "Clara erzählt ihrem Bruder, ihr Chef habe sie zum Reden eingeladen." }
    - { time: "Fr 17:02", text: "Clara schreibt der Vorstandschefin – die Mail bleibt ungelesen." }
    - { time: "Sa 18:30", text: "Clara trifft Lorenz am Wochenendhaus Seeweg 7." }
    - { time: "Sa 18:55", text: "Lorenz' Dienstwagen lädt am Ladepark Moorsee." }
    - { time: "Sa 19:40", text: "Lorenz betäubt Clara und schaltet ihr Handy aus." }
    - { time: "So 10:14", text: "Mareike hebt mit Claras Karte 1.000 € ab." }
    - { time: "So 14:12", text: "Mareike postet das „Lissabon“-Foto aus einem Café in Hafenau." }
    - { time: "So 22:47", text: "Die gefälschte Kündigung geht an Novapay." }
    - { time: "Mo 08:00", text: "Leonie meldet Clara als vermisst." }
  redHerrings:
    - { character: jonas, clue: "2.000 € gingen an den verschuldeten Bruder", debunkedBy: in_jonas_schicht, explanation: "Die Überweisung sollte ihn belasten. Er war in der Nachtschicht." }
    - { character: darius, clue: "Die Drohnachricht des Exfreunds", debunkedBy: in_darius_stream, explanation: "Er spielte den ganzen Abend live vor Tausenden Zuschauern." }
    - { character: leonie, clue: "Streit um die Miete und die Wohnungskündigung", debunkedBy: in_leonie_hochzeit, explanation: "Sie war auf einer Hochzeit in Gerdau – und war es, die Alarm schlug." }
    - { character: ostermann, clue: "Die Chefin mit dem Börsengang", debunkedBy: in_ostermann_oslo, explanation: "Sie war in Oslo und hatte Claras Mail nie gelesen." }
  epilogue: Clara erholte sich innerhalb weniger Tage. Ihre Aussage bestätigte alles. Novapay sagte den Börsengang ab und zeigte sich selbst bei der Finanzaufsicht an. Clara arbeitet heute für die Aufsicht – in der Abteilung für Identitätsbetrug. Ihre E-Mails unterschreibt sie weiterhin mit „Liebe Grüße, C.“.
