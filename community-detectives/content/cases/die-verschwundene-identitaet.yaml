# COMMUNITY DETECTIVES – Fall: Die verschwundene Identität
# Alle Personen, Orte und Unternehmen sind frei erfunden.
id: die-verschwundene-identitaet
version: 1
title: Die verschwundene Identität
tagline: Clara Weiß ist verschwunden. Doch irgendjemand lebt seit Sonntag ihr Leben weiter.
genre: vermisst
difficulty: fortgeschritten
tier: creator
estimatedMinutes: 80
accent: "#2f7a6b"

briefing:
  location: Hafenau
  date: Montag, 22. September, 08:00 Uhr
  intro: |
    Leonie Kramer meldet ihre Mitbewohnerin als vermisst: Clara Weiß, 29, Datenanalystin beim Zahlungsdienstleister Novapay, ist seit Samstagabend nicht nach Hause gekommen.
    Die Polizei winkt zunächst ab. Denn „Clara“ ist sehr aktiv: Am Sonntag hob sie Geld ab, postete ein Foto aus Lissabon („Brauche eine Auszeit“), kündigte per E-Mail ihren Job und schickte ihrem Vermieter die Kündigung der Wohnung.
    Leonie ist sich sicher: „Das ist nicht Clara. So schreibt sie nicht.“
  objective: Findet heraus, ob Clara freiwillig gegangen ist. Wenn nicht – wer gibt sich als sie aus, warum, und wo ist sie?
  question: Wer ist für Claras Verschwinden verantwortlich?

phases:
  - id: spuren
    title: Ein Leben aus zweiter Hand
    goal: Prüft alle Lebenszeichen seit Sonntag. Was davon stammt wirklich von Clara?
  - id: umfeld
    title: Claras Welt
    goal: Wer hätte einen Grund, Clara verschwinden zu lassen? Prüft Alibis und Motive.
  - id: suche
    title: Die Suche
    goal: Findet heraus, wo Clara ist – bevor es zu spät ist.

characters:
  - id: clara
    name: Clara Weiß
    role: victim
    age: 29
    occupation: Datenanalystin bei Novapay
    color: "#2f7a6b"
    profile: Analytisch, gewissenhaft, rechtshändig, keine Tattoos. Unterschreibt seit Jahren mit „Liebe Grüße, C.“ und nennt ihre Mitbewohnerin nur „Leo“.
    personality: Ruhig, beharrlich, lässt nicht locker, wenn Zahlen nicht stimmen.
    relation: Die Vermisste.
    secret: Hat entdeckt, dass im Team von Fabian Lorenz Konten mit gestohlenen Identitäten angelegt werden.
  - id: lorenz
    name: Fabian Lorenz
    role: suspect
    age: 36
    occupation: Teamleiter Kontoeröffnung bei Novapay
    color: "#4f5f7a"
    profile: Claras Vorgesetzter. Gilt als brillant und charmant. Seine Familie besitzt ein Wochenendhaus am Moorsee.
    personality: Selbstbewusst, schlagfertig, perfektionistisch.
    relation: Claras Chef.
    alibi: War am Samstag den ganzen Abend mit seiner Freundin Mareike zu Hause in Hafenau.
    motive: Keins bekannt – er lobte Clara stets.
    secret: Betreibt mit falschen Identitäten eine Kontofabrik für Geldwäsche. Lockte Clara zum Wochenendhaus, betäubte sie und sperrte sie im Keller ein.
  - id: mareike
    name: Mareike Sauer
    role: suspect
    age: 28
    occupation: Friseurin, Fabians Freundin
    color: "#7a4f6a"
    profile: Betreibt einen kleinen Salon. Hat dunkelblond gefärbtes Haar – ähnlich wie Clara. Linkes Handgelenk mit einer kleinen Schwalbe tätowiert.
    personality: Freundlich, unsicher, tut alles für Fabian.
    relation: Kennt Clara nur flüchtig von einer Firmenfeier.
    alibi: Saß am Samstagabend mit Fabian auf dem Sofa.
    motive: Keins bekannt.
    secret: Hat sich am Sonntag als Clara ausgegeben – Geld abgehoben, das Foto gepostet, die Kündigungen verschickt.
  - id: jonas
    name: Jonas Weiß
    role: suspect
    age: 33
    occupation: Lagerarbeiter, Claras Bruder
    color: "#7a6a4f"
    profile: Hat Schulden und lieh sich immer wieder Geld von seiner Schwester. Bekam am Sonntag 2.000 Euro von Claras Konto überwiesen.
    personality: Hitzköpfig, loyal, schlecht im Erklären.
    relation: Bruder.
    alibi: Hatte Samstag Nachtschicht im Lager.
    motive: Geldnot. Die Überweisung ging an ihn.
    secret: Hat die Überweisung nicht angefordert und sich nicht getraut, sie zu melden – er brauchte das Geld.
  - id: leonie
    name: Leonie Kramer
    role: suspect
    age: 29
    occupation: Grafikdesignerin, Mitbewohnerin
    color: "#6a7a4f"
    profile: Wohnt seit vier Jahren mit Clara zusammen. Hat die Vermisstenanzeige erstattet.
    personality: Laut, warmherzig, sehr hartnäckig.
    relation: Mitbewohnerin und beste Freundin.
    alibi: War am Samstag auf einer Hochzeit in Gerdau.
    motive: Streit über die Miete; profitiert von der Wohnungskündigung nicht – oder doch?
    secret: Hatte mit Clara Streit, weil sie ausziehen will. Fühlt sich schuldig.
  - id: darius
    name: Darius Mehr
    role: suspect
    age: 31
    occupation: E-Sport-Spieler, Claras Exfreund
    color: "#5a4f7a"
    profile: Trennung vor drei Monaten. Hat Clara danach wochenlang Nachrichten geschrieben.
    personality: Eifersüchtig, sprunghaft, gibt sich cool.
    relation: Exfreund.
    alibi: Spielte am Samstag ein Online-Turnier im Livestream.
    motive: "Schrieb Clara im August: „Du wirst es noch bereuen.“"
    secret: Wollte Clara zurück. Hat mit dem Verschwinden nichts zu tun.
  - id: ostermann
    name: Dr. Helga Ostermann
    role: suspect
    age: 58
    occupation: Vorstandsvorsitzende von Novapay
    color: "#5d5d5d"
    profile: Führt Novapay seit der Gründung. Ein Skandal würde den geplanten Börsengang zerstören.
    personality: Kühl, effizient, misstraut der Polizei.
    relation: Claras oberste Chefin.
    alibi: Seit Freitagabend auf Geschäftsreise in Oslo.
    motive: Ein Datenskandal würde den Börsengang ruinieren.
    secret: Hat Claras Warnung nie gelesen und macht sich deshalb Vorwürfe.

insights:
  - id: in_signatur_clara
    title: „Liebe Grüße, C.“
    text: Clara unterschreibt Nachrichten seit Jahren mit „Liebe Grüße, C.“ und nennt Leonie „Leo“. Die Nachrichten seit Sonntag sind mit „LG Clara“ unterschrieben.
    category: identitaet
    characters: [clara]
  - id: in_mail_gefaelscht
    title: Die Kündigung ist nicht von Clara
    text: Stil, Unterschrift und Anrede passen nicht zu Clara. Die Kündigungsmail an Novapay hat jemand anderes geschrieben.
    category: widerspruch
  - id: in_foto_hafenau
    title: Lissabon liegt in Hafenau
    text: In der Fensterspiegelung des „Lissabon“-Fotos ist der Hafenauer Fernsehturm mit seinem roten Ring zu sehen. Das Foto entstand in Hafenau.
    category: widerspruch
  - id: in_atm_tattoo
    title: Die Frau am Geldautomaten
    text: Die Frau, die am Sonntag um 10:14 Uhr mit Claras Karte 1.000 € abhob, trägt eine Schirmmütze – und hat eine kleine Schwalbe auf das linke Handgelenk tätowiert.
    category: spur
    timeline: { time: "So 10:14", sort: 50, text: "Eine Frau hebt mit Claras Karte 1.000 € ab." }
  - id: in_kein_tattoo
    title: Clara hat keine Tattoos
    text: Leonie bestätigt – Clara hat keine Tattoos. Die Frau am Automaten war nicht Clara.
    category: identitaet
    characters: [clara]
  - id: in_tattoo_mareike
    title: Die Schwalbe
    text: Mareike Sauer hat genau diese Schwalbe auf dem linken Handgelenk – zu sehen auf dem Werbefoto ihres Salons.
    category: identitaet
    characters: [mareike]
  - id: in_ueberweisung_jonas
    title: 2.000 € an Jonas
    text: Am Sonntag um 11:30 Uhr gingen 2.000 € von Claras Konto an ihren Bruder Jonas – per Onlinebanking aus Hafenau.
    category: spur
    characters: [jonas]
    timeline: { time: "So 11:30", sort: 55, text: "Überweisung von 2.000 € an Jonas." }
  - id: in_post_1412
    title: Der Post um 14:12
    text: "Sonntag 14:12 Uhr erscheint auf Claras Profil das „Lissabon“-Foto: „Brauche eine Auszeit. Sucht mich nicht.“"
    category: zeitlinie
    timeline: { time: "So 14:12", sort: 60, text: "„Lissabon“-Foto auf Claras Profil." }
  - id: in_kuendigung_2247
    title: Kündigung um 22:47
    text: Die Kündigungsmail an Novapay wurde am Sonntag um 22:47 Uhr verschickt – von Claras privater Adresse, angemeldet in Hafenau.
    category: zeitlinie
    timeline: { time: "So 22:47", sort: 70, text: "Kündigungsmail an Novapay." }
  - id: in_unterschrift_falsch
    title: Die falsche Unterschrift
    text: Bei der Wohnungskündigung fehlt der typische Querstrich durch das W – Claras Unterschrift wurde nachgemacht.
    category: widerspruch
  - id: in_kalender_moorsee
    title: „F. – Moorsee, reden“
    text: "Claras Kalender (synchronisiert auf ihr Tablet): Samstag 18:30 Uhr „F. – Moorsee, reden“."
    category: spur
    characters: [clara]
    timeline: { time: "Sa 18:30", sort: 20, text: "Clara hat einen Termin: „F. – Moorsee, reden“." }
  - id: in_letzter_ping
    title: Letztes Lebenszeichen am Moorsee
    text: "Claras Handy war zuletzt am Samstag um 19:40 Uhr in der Funkzelle Moorsee-Süd eingeloggt. Danach: ausgeschaltet."
    category: zeitlinie
    characters: [clara]
    timeline: { time: "Sa 19:40", sort: 30, text: "Claras Handy loggt sich zuletzt in Moorsee-Süd ein." }
  - id: in_ladesaeule
    title: Ladesäule Moorsee, 18:55
    text: Das Firmenauto mit dem Kennzeichen HF-NP 36 wurde am Samstag um 18:55 Uhr am Ladepark Moorsee geladen.
    category: spur
    timeline: { time: "Sa 18:55", sort: 25, text: "Firmenwagen HF-NP 36 lädt am Moorsee." }
  - id: in_auto_lorenz
    title: Lorenz war am Moorsee
    text: HF-NP 36 ist laut Fuhrparkliste Fabian Lorenz zugeteilt. Sein Alibi „den ganzen Abend zu Hause“ ist falsch.
    category: widerspruch
    characters: [lorenz]
  - id: in_wochenendhaus
    title: Das Wochenendhaus der Lorenz
    text: Familie Lorenz besitzt ein Wochenendhaus am Seeweg 7 am Moorsee – mitten in der Funkzelle Moorsee-Süd.
    category: spur
    characters: [lorenz]
  - id: in_mail_ostermann
    title: Claras Warnung
    text: "Freitag 17:02 Uhr schrieb Clara an die Vorstandschefin: „Ich muss Ihnen dringend etwas über Konten im Team Lorenz zeigen. Bitte nur persönlich.“ Die Mail ist ungelesen."
    category: motiv
    characters: [lorenz, clara]
    timeline: { time: "Fr 17:02", sort: 10, text: "Clara warnt die Vorstandschefin per Mail – ungelesen." }
  - id: in_schuhkarton
    title: Der Schuhkarton
    text: "Auf Claras Tablet steht: „Kopie im Schuhkarton, falls was ist.“ Leonie findet darin einen USB-Stick."
    category: spur
    characters: [clara]
  - id: in_konten_lorenz
    title: Die Kontofabrik
    text: Alle 80 verdächtigen Konten auf Claras Liste wurden mit dem Benutzerkürzel FLZ angelegt – Fabian Lorenz.
    category: motiv
    characters: [lorenz]
  - id: in_ostermann_oslo
    title: Ostermann in Oslo
    text: Ostermann flog am Freitag um 19:05 Uhr nach Oslo und kehrte erst am Montag zurück. Claras Mail hat sie nie geöffnet.
    category: entlastung
    characters: [ostermann]
  - id: in_jonas_schicht
    title: Jonas in der Nachtschicht
    text: Laut Zeiterfassung arbeitete Jonas von Samstag 18:00 bis Sonntag 02:10 Uhr im Lager in Hafenau-Ost.
    category: entlastung
    characters: [jonas]
  - id: in_darius_stream
    title: Darius im Livestream
    text: Darius spielte am Samstag von 17:00 bis 23:20 Uhr ununterbrochen live – mit Kamera.
    category: entlastung
    characters: [darius]
  - id: in_leonie_hochzeit
    title: Leonie auf der Hochzeit
    text: Leonie war von Samstagmittag bis Sonntagnachmittag auf einer Hochzeit in Gerdau, 200 Kilometer entfernt.
    category: entlastung
    characters: [leonie]
  - id: in_leo
    title: „Mach dir keine Sorgen, Leonie“
    text: "Die Nachricht vom Sonntag nennt Leonie bei vollem Namen – Clara schreibt seit Jahren nur „Leo“."
    category: widerspruch
  - id: in_ort_clara
    title: Clara ist am Moorsee
    text: Termin, letzter Handy-Kontakt, Ladesäule und Wochenendhaus zeigen auf denselben Ort – das Haus der Familie Lorenz am Seeweg 7.
    category: wendung
    characters: [lorenz]
  - id: in_clara_gefunden
    title: Clara lebt
    text: Die Polizei findet Clara im Kellerraum des Wochenendhauses am Seeweg 7 – geschwächt, betäubt, aber am Leben. Ihr Laptop liegt zerschlagen im Kamin.
    category: wendung
    characters: [lorenz, clara]
  - id: in_lorenz_mareike_alibi
    title: Ein gegenseitiges Alibi
    text: Fabian und Mareike geben sich gegenseitig ein Alibi für Samstagabend – und beide behaupten, Clara kaum zu kennen.
    category: alibi
    characters: [lorenz, mareike]
  - id: in_salon_sonntag
    title: Der Salon war geschlossen
    text: Mareikes Salon war am Sonntag geschlossen. Für Sonntag hat sie kein Alibi – sie sagt, sie sei „spazieren“ gewesen.
    category: alibi
    characters: [mareike]

