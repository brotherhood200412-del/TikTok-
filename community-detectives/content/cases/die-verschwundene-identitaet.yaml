        - { id: u_neigung, label: "Linksneigung, kein Querstrich durchs W und „ss“ statt „ß“" }
        - { id: u_stempel, label: "Der Poststempel Hafenau-Nord" }
        - { id: u_datum, label: "Das fehlende Datum" }
    answer: { choice: u_neigung }
    hints:
      - Vergleicht die Spalten der Tabelle Zeile für Zeile.
      - Clara ist Rechtshänderin – welche Schriftneigung passt dazu?
    reveals: [in_unterschrift_falsch]
    success: Alle drei Merkmale weichen ab. Die Fälscherin schreibt mit links.

  - id: p_kuerzel
    title: Die Kontofabrik
    type: compare
    prompt: Wer hat die 80 verdächtigen Konten angelegt? Gebt den Namen ein.
    evidence: [ev_usb, ev_organigramm]
    unlock: { all: [{ evidence: ev_usb }, { evidence: ev_organigramm }] }
