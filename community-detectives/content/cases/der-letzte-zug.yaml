# COMMUNITY DETECTIVES – Fall: Der letzte Zug um 23:17
# Alle Personen, Orte und Unternehmen sind frei erfunden.
id: der-letzte-zug
version: 1
title: Der letzte Zug um 23:17
tagline: Die letzte Regionalbahn der Nacht. Ein verschlossenes Abteil. Und ein Fahrgast, der nie ankam.
genre: mord
difficulty: fortgeschritten
tier: free
estimatedMinutes: 75
accent: "#3f6c8f"

briefing:
  location: RB 47 Halvenstedt – Dornfelde
  date: Donnerstag, 6. November
  intro: |
    Die RB 47 ist der letzte Zug des Abends von Halvenstedt nach Dornfelde. Zwei Wagen, drei Zwischenhalte, kaum Fahrgäste.
    Um 00:18 Uhr findet Zugbegleiter Tobias Renner bei der Endkontrolle in Dornfelde einen Toten im Erste-Klasse-Abteil von Wagen 1: Dr. Konrad Selbig, 54, Patentanwalt aus Halvenstedt. Der Vorhang war zugezogen, am Türgriff hing ein Schild „Bitte nicht stören“.
    Selbig wurde mit einem Schlag gegen den Kopf getötet. Seine Tochter Lara wartete am Bahnsteig in Dornfelde auf ihn.
  objective: Rekonstruiert die Fahrt, prüft jedes Alibi und findet heraus, wer Konrad Selbig getötet hat.
  question: Wer hat Dr. Konrad Selbig im Zug getötet?

phases:
  - id: tatort
    title: Das Abteil
    goal: Untersucht den Fundort und den Bericht der Rechtsmedizin. Wann und womit wurde Selbig getötet?
  - id: fahrt
    title: Die Fahrt
    goal: Wer war wann in welchem Wagen? Rekonstruiert die Fahrt – Minute für Minute.
  - id: geld
    title: Die Spur des Geldes
    goal: Warum musste Konrad Selbig sterben? Folgt dem Geld.

characters:
  - id: selbig
    name: Dr. Konrad Selbig
    role: victim
    age: 54
    occupation: Patentanwalt, Seniorpartner der Kanzlei Selbig & Achterberg
    color: "#5d5d5d"
    profile: Erfolgreicher, penibler Patentanwalt. Verwitwet, eine Tochter. Fuhr nach späten Terminen immer mit der letzten Bahn nach Dornfelde.
    personality: Korrekt bis zur Sturheit. Trug stets seine braune Aktentasche mit dem Monogramm „K.S.“ bei sich.
    relation: Das Opfer.
    secret: Hatte am Nachmittag von der Bank erfahren, dass vom Treuhandkonto der Kanzlei Geld verschwunden ist.
  - id: kahl
    name: Benedikt Kahl
    role: suspect
    age: 35
    occupation: Büroleiter der Kanzlei Selbig & Achterberg
    color: "#6b6f78"
    profile: Seit sechs Jahren Selbigs rechte Hand. Wohnt in Brückenau. Trägt bei jedem Wetter seinen grauen Wollmantel.
    personality: Höflich, hilfsbereit, auffallend gut vorbereitet. Spricht gern in Uhrzeiten.
    relation: Selbigs Büroleiter, saß mit ihm im selben Zug.
    alibi: Ist um 23:31 Uhr in Brückenau ausgestiegen und zu Fuß nach Hause gegangen.
    motive: Keins bekannt – er galt als Selbigs Vertrauter.
    secret: Hat über eine eigene Firma (BK Consulting) 48.500 € vom Treuhandkonto abgezweigt. Selbig wollte ihn im Zug zur Rede stellen.
  - id: duran
    name: Elif Duran
    role: suspect
    age: 44
    occupation: Ingenieurin und Erfinderin
    color: "#7a5a3c"
    profile: Entwickelte ein neuartiges Ventil. Selbigs Kanzlei versäumte eine Frist – ihr Patent ist verfallen.
    personality: Temperamentvoll, direkt, nachtragend – aber ehrlich.
    relation: Ehemalige Mandantin, hasst Selbig.
    alibi: Saß die ganze Fahrt über in Wagen 2.
    motive: Selbigs Fehler hat sie ihre Erfindung gekostet.
    secret: Hat Selbig am Bahnsteig angeschrien und ihm gedroht. Danach hat sie Wagen 2 nicht mehr verlassen.
  - id: renner
    name: Tobias Renner
    role: suspect
    age: 29
    occupation: Zugbegleiter
    color: "#3f6c8f"
    profile: Fährt die Strecke seit drei Jahren. Hat einen Generalschlüssel für alle Türen des Zuges.
    personality: Freundlich, etwas fahrig, vermeidet Ärger.
    relation: Fand die Leiche bei der Endkontrolle.
    alibi: War bis Kalten in Wagen 2 und auf dem Bahnsteig.
    motive: Hätte jederzeit ins Abteil gelangen können.
    secret: Hat das Abteil mit dem „Bitte nicht stören“-Schild bei der Kontrolle nach Kalten nicht geöffnet – Vorschrift wäre gewesen, zu klopfen und nachzusehen. Er fürchtet eine Abmahnung.
  - id: lara
    name: Lara Selbig
    role: suspect
    age: 24
    occupation: Studentin, Tochter des Opfers
    color: "#8a4f63"
    profile: Studiert Medizin in Dornfelde. Einzige Erbin ihres Vaters.
    personality: Gefasst, analytisch, kämpft um Haltung.
    relation: Tochter. Wartete in Dornfelde am Bahnsteig.
    alibi: Wartete ab kurz vor Mitternacht in Dornfelde.
    motive: Erbt die Kanzleianteile und das Haus.
    secret: Hatte mit ihrem Vater gestritten, weil sie das Studium abbrechen wollte. Sie fühlt sich schuldig.
  - id: achterberg
    name: Miriam Achterberg
    role: suspect
    age: 47
    occupation: Patentanwältin, Partnerin der Kanzlei
    color: "#4f7a6a"
    profile: Seit zwölf Jahren Selbigs Partnerin. Will die Kanzlei modernisieren – Selbig blockierte jede Veränderung.
    personality: Ehrgeizig, kontrolliert, wählt jedes Wort genau.
    relation: Geschäftspartnerin. Hat Selbig an diesem Abend zum Bahnhof gefahren.
    alibi: Hat Selbig um 23:03 Uhr am Bahnhof abgesetzt und ist sofort nach Hause gefahren.
    motive: Wollte Selbig aus der Kanzlei drängen; nach seinem Tod gehört sie ihr fast allein.
    secret: Hatte mit Selbig im Auto einen heftigen Streit über den Verkauf seiner Anteile. Sie verschweigt das zunächst.
  - id: grevenbroich
    name: Hannes Grevenbroich
    role: witness
    age: 66
    occupation: Pensionierter Kriminalhauptkommissar
    color: "#7a7a5a"
    profile: Fuhr in Wagen 1, im Großraumbereich direkt vor dem Erste-Klasse-Abteil, zu seiner Schwester nach Dornfelde.
    personality: Ruhig, genau, ein bisschen stolz darauf, „immer noch ein Auge für Details“ zu haben.
    relation: Fahrgast in Wagen 1.
    secret: Ehrlicher Zeuge. Hat die Person im grauen Mantel nur von hinten gesehen.

insights:
  - id: in_todeszeit
    title: Todeszeitpunkt 23:35–23:55
    text: Laut Rechtsmedizin starb Selbig zwischen 23:35 und 23:55 Uhr.
    category: zeitlinie
    characters: [selbig]
  - id: in_waffe_form
    title: Ein Werkzeug mit Spitze
    text: Die Kopfverletzung stammt von einem schweren Gegenstand mit kegelförmiger Spitze, etwa 1 cm Durchmesser.
    category: spur
  - id: in_nothammer_fehlt
    title: Der Nothammer fehlt
    text: Im Abteil ist die Halterung des Nothammers leer. Der Hammer ist verschwunden.
    category: spur
  - id: in_waffe_nothammer
    title: Tatwaffe Nothammer
    text: Die kegelförmige Wunde passt exakt zur Spitze eines Nothammers. Der Täter hat die Waffe im Abteil vorgefunden – und mitgenommen.
    category: spur
  - id: in_koffer_fehlt
    title: Die Aktentasche ist weg
    text: Selbigs braune Aktentasche mit dem Monogramm „K.S.“ ist nicht im Abteil. Er hatte sie immer dabei.
    category: spur
    characters: [selbig]
  - id: in_zwei_becher
    title: Zwei Kaffeebecher
    text: Im Abteil stehen zwei Kaffeebecher vom Bahnhofskiosk Halvenstedt. Selbig war nicht allein.
    category: spur
  - id: in_verspaetung
    title: Neun Minuten zu spät
    text: Wegen einer Signalstörung fuhr der Zug erst um 23:26 statt 23:17 Uhr ab. Alle Halte verschoben sich um neun Minuten.
    category: zeitlinie
    timeline: { time: "23:26", sort: 30, text: "Der Zug fährt mit neun Minuten Verspätung in Halvenstedt ab." }
  - id: in_brueckenau_2340
    title: Halt in Brückenau um 23:40
    text: Der Zug hielt nicht um 23:31, sondern erst um 23:40 Uhr in Brückenau.
    category: zeitlinie
    timeline: { time: "23:40", sort: 50, text: "Halt in Brückenau (planmäßig 23:31)." }
  - id: in_tuer_gesperrt
    title: Die Übergangstür klemmt
    text: Die Tür zwischen Wagen 1 und Wagen 2 klemmte ab 23:20 Uhr und war gesperrt. Zwischen den Wagen gab es während der Fahrt keinen Durchgang.
    category: spur
    timeline: { time: "23:20", sort: 25, text: "Übergangstür zwischen den Wagen klemmt – gesperrt." }
  - id: in_niemand_ausgestiegen
    title: In Brückenau stieg niemand aus Wagen 1
    text: Die Bahnsteigkamera und Grevenbroich bestätigen – in Brückenau hat niemand Wagen 1 verlassen.
    category: widerspruch
  - id: in_kein_wechsel
    title: Niemand wechselte den Wagen
    text: Wegen der gesperrten Übergangstür hätte man nur in Brückenau über den Bahnsteig wechseln können. Die Kamera zeigt, dass das niemand tat. Wer in Wagen 2 saß, kam nicht an Selbig heran.
    category: entlastung
    characters: [duran]
  - id: in_schlag_2347
    title: Ein dumpfer Schlag um 23:47
    text: Grevenbroich hörte um 23:47 Uhr einen dumpfen Schlag aus dem Erste-Klasse-Abteil.
    category: zeitlinie
    timeline: { time: "23:47", sort: 60, text: "Dumpfer Schlag aus dem Abteil." }
  - id: in_mann_grauer_mantel
    title: Der Mann im grauen Mantel
    text: Kurz vor Kalten ging ein Mann im grauen Mantel mit einer braunen Aktentasche aus Richtung Abteil zur Tür.
    category: spur
  - id: in_tatfenster
    title: Tat zwischen Brückenau und Kalten
    text: Selbig lebte um 23:35 noch, der Schlag fiel um 23:47 – zwischen den Halten Brückenau (23:40) und Kalten (23:53).
    category: spur
  - id: in_kalten_mann
    title: Kalten, 23:53
    text: Die Bahnsteigkamera in Kalten zeigt um 23:53 Uhr einen Mann im grauen Wollmantel, der mit einer braunen Aktentasche Wagen 1 verlässt und kurz an einem Mülleimer stehen bleibt.
    category: spur
    timeline: { time: "23:53", sort: 70, text: "Ein Mann im grauen Mantel verlässt in Kalten Wagen 1." }
  - id: in_mantel_kahl
    title: Der graue Mantel
    text: Benedikt Kahl trägt bei jedem Wetter einen grauen Wollmantel – genau wie der Mann auf der Kamera in Kalten.
    category: identitaet
    characters: [kahl]
  - id: in_kahl_halvenstedt
    title: Kahl und Selbig am Bahnsteig
    text: Um 23:08 Uhr warten Kahl und Selbig gemeinsam am Bahnsteig in Halvenstedt.
    category: zeitlinie
    characters: [kahl]
    timeline: { time: "23:08", sort: 10, text: "Kahl und Selbig warten gemeinsam am Bahnsteig." }
  - id: in_kiosk_4471
    title: Zwei Kaffee, Karte ****4471
    text: Am Bahnhofskiosk wurden um 23:09 Uhr zwei große Kaffee mit einer Karte mit der Endung 4471 bezahlt.
    category: spur
    timeline: { time: "23:09", sort: 15, text: "Zwei Kaffee am Kiosk, bezahlt mit Karte ****4471." }
  - id: in_kahl_kaffee
    title: Kahl saß bei Selbig
    text: Karte ****4471 ist Kahls Firmenkarte. Er hat beide Kaffees gekauft – der zweite Becher im Abteil war seiner.
    category: identitaet
    characters: [kahl]
  - id: in_kahl_taxi
    title: Taxi ab Kalten um 23:58
    text: Das Taxi von Kalten nach Brückenau um 23:58 Uhr wurde mit Kahls Firmenkarte ****4471 bezahlt.
    category: widerspruch
    characters: [kahl]
    timeline: { time: "23:58", sort: 80, text: "Kahl nimmt in Kalten ein Taxi nach Brückenau." }
  - id: in_wilke_0020
    title: Heimkehr um 00:20
    text: Kahls Nachbarin sah ihn gegen 00:20 Uhr aus einem Taxi steigen – nicht um 23:45 zu Fuß, wie er behauptet.
    category: widerspruch
    characters: [kahl]
    timeline: { time: "00:20", sort: 90, text: "Kahl steigt vor seinem Haus in Brückenau aus einem Taxi." }
  - id: in_kahl_luegt
    title: Kahl kannte die Verspätung nicht
    text: Kahl behauptet, „pünktlich um 23:31“ in Brückenau ausgestiegen zu sein. Der Zug war aber erst um 23:40 dort. Wer wirklich ausgestiegen wäre, hätte die Verspätung erlebt.
    category: widerspruch
    characters: [kahl]
  - id: in_nachricht_2335
    title: „Kahl sitzt mir gegenüber“
    text: "Selbigs letzte Nachricht an seine Tochter, 23:35 Uhr: „Kahl sitzt mir gegenüber. Es geht um das Treuhandkonto. Ich kläre das jetzt.“"
    category: wendung
    characters: [kahl, selbig]
    timeline: { time: "23:35", sort: 45, text: "Selbigs letzte Nachricht: „Kahl sitzt mir gegenüber.“" }
