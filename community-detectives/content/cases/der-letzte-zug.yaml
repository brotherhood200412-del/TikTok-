interrogations:
  - character: kahl
    intro: Benedikt Kahl sitzt aufrecht, den grauen Mantel ordentlich über die Stuhllehne gelegt. Er wirkt bestürzt – und sehr gefasst.
    topics:
      - id: alibi
        question: Wann haben Sie den Zug verlassen?
        responses:
          - when: { insight: in_kahl_taxi }
            mood: verzweifelt
            stress: 85
            text: "Ich … also gut. Ich bin bis Kalten gefahren. Ich wollte noch nachdenken. Dann bin ich mit dem Taxi zurück. Aber Konrad lebte noch, als ich ging!"
          - mood: ruhig
            stress: 10
            text: "In Brückenau, ganz normal, um 23:31. Pünktlich auf die Minute. Ich war um Viertel vor zwölf zu Hause – fragen Sie meine Nachbarin, Frau Wilke, die sitzt immer am Fenster."
      - id: verspaetung
        question: War der Zug pünktlich?
        unlock: { insight: in_brueckenau_2340 }
        responses:
          - mood: nervoes
            stress: 60
            reveals: in_kahl_luegt
            text: "Pünktlich? Ja … ich glaube schon. Ich habe nicht darauf geachtet. Wieso? … Neun Minuten? Dann habe ich mich eben vertan."
      - id: selbig
        question: Worüber haben Sie mit Dr. Selbig gesprochen?
        responses:
          - when: { insight: in_nachricht_2335 }
            mood: wuetend
            stress: 80
            text: "Er hat mir das geschrieben? … Ja, er hat mich angeschrien. Wegen eines Missverständnisses mit dem Treuhandkonto. Das hätte sich alles aufgeklärt!"
          - mood: kooperativ
            text: "Über den Mandanten Hofmeister, über Termine. Konrad war müde. Ich habe ihm einen Kaffee spendiert, das war alles."
      - id: kaffee
        question: Wer hat den Kaffee am Kiosk bezahlt?
        unlock: { insight: in_kiosk_4471 }
        responses:
          - mood: ausweichend
            stress: 40
            text: "Ich, mit der Firmenkarte. Das ist doch kein Geheimnis. Ich saß ja bis Brückenau bei ihm."
      - id: geld
        question: Was ist die BK Consulting UG?
        unlock: { insight: in_bk_kahl }
        responses:
          - when: { insight: in_veruntreuung }
            mood: gebrochen
            stress: 95
            text: "Ich wollte es zurückzahlen. Alles. Konrad wollte die Polizei rufen, gleich morgen früh. Er hat gesagt, ich sei für ihn gestorben. Und dann … der Hammer hing da einfach. Ich wollte das nicht."
          - mood: arrogant
            stress: 70
            text: "Eine Nebentätigkeit. Völlig legal und genehmigt. Recherchen, Übersetzungen. Die Kanzlei hat davon profitiert."
      - id: mantel
        question: Tragen Sie immer diesen grauen Mantel?
        unlock: { insight: in_mantel_kahl }
        responses:
          - mood: nervoes
            stress: 65
            text: "Viele Männer tragen graue Mäntel. Das beweist gar nichts."

  - character: duran
    intro: Elif Duran trommelt mit den Fingern auf den Tisch. Sie macht kein Geheimnis aus ihrer Abneigung.
    topics:
      - id: selbig
        question: Woher kannten Sie Dr. Selbig?
        responses:
          - mood: wuetend
            stress: 40
            text: "Er war mein Anwalt. Seine Kanzlei hat eine Frist verschlafen, und mein Patent war weg. Sieben Jahre Arbeit! Lesen Sie den Brief, den er mir geschrieben hat."
      - id: streit
        question: Sie haben am Bahnsteig mit ihm gestritten.
        unlock: { insight: in_duran_streit }
        responses:
          - mood: wuetend
            stress: 55
            text: "Ja! Ich habe ihn angeschrien. Ich habe gesagt, er soll zur Hölle fahren. Aber ich habe ihn nicht dorthin geschickt. Danach bin ich in Wagen 2 gestiegen und habe mich nicht mehr bewegt."
      - id: fahrt
        question: Was haben Sie während der Fahrt gemacht?
        responses:
          - mood: kooperativ
            text: "Gesessen und gekocht vor Wut. Ab Brückenau hat der Schaffner ewig bei mir gestanden – ich hatte das falsche Ticket, er musste nachlösen und dann kam noch jemand mit Fahrrad. Bis Kalten war der quasi bei uns im Wagen."
      - id: tuer
        question: Hätten Sie in Wagen 1 wechseln können?
        unlock: { insight: in_tuer_gesperrt }
        responses:
          - mood: ruhig
            text: "Die Tür hat geklemmt, der Schaffner hat ein Schild drangehängt. Ich hätte ja aussteigen und vorne wieder einsteigen müssen. Hab ich nicht."

  - character: renner
    intro: Tobias Renner hat noch seine Uniform an. Seine Hände zittern leicht.
    topics:
      - id: kontrolle
        question: Wann haben Sie Wagen 1 kontrolliert?
        responses:
          - when: { topic: renner.abteil }
            mood: verzweifelt
            stress: 50
            text: "Nach Kalten, 23:55, beim Herrn Grevenbroich. Das Abteil … ich habe nicht reingeschaut. Da hing das Schild. Ich weiß, ich hätte klopfen müssen."
          - mood: nervoes
            stress: 30
            text: "Erst nach Kalten. Die Übergangstür klemmte ja seit 23:20, die hab ich selbst gesperrt. Vorher war ich in Wagen 2 und in Brückenau auf dem Bahnsteig."
      - id: abteil
        question: Haben Sie das Abteil vor der Endkontrolle geöffnet?
        responses:
          - mood: verzweifelt
            stress: 55
            text: "Nein. Bitte nicht stören – manche Fahrgäste schlafen. Wenn ich da reingeschaut hätte … vielleicht hätte er noch gelebt? Nein, oder? Er war doch schon …"
      - id: brueckenau
        question: Wer ist in Brückenau ausgestiegen?
        unlock: { phase: fahrt }
        responses:
          - mood: kooperativ
            text: "Nur eine Frau mit Kinderwagen aus Wagen 2. Aus Wagen 1 niemand, da ging keine Tür auf, das sieht man am Display. Und wir hatten neun Minuten Verspätung, wir waren erst um 23:40 da."
      - id: schluessel
        question: Wer hat Schlüssel für die Übergangstür?
        unlock: { insight: in_tuer_gesperrt }
        responses:
          - mood: ruhig
            text: "Ich. Aber die Tür ging nicht mal mit Schlüssel – das Schloss war verklemmt. Die Werkstatt hat sie heute früh aufgeflext."

  - character: lara
    intro: Lara Selbig hält einen Pappbecher Tee, den sie nicht trinkt. Ihre Stimme ist sehr ruhig.
    topics:
      - id: abend
        question: Wo waren Sie am Abend?
        responses:
          - mood: ruhig
            text: "In Dornfelde. Ich bin kurz vor Mitternacht zum Bahnhof gefahren, das Parkticket habe ich noch. Ich habe auf Papas Zug gewartet. Er kam an. Er stieg nicht aus."
      - id: vater
        question: Wie war Ihr Verhältnis zu Ihrem Vater?
        responses:
          - mood: verzweifelt
            stress: 30
            text: "Wir haben gestritten. Ich will das Studium abbrechen. Er war enttäuscht. Aber er hat mich trotzdem jeden Donnerstag gefragt, ob ich ihn abhole."
      - id: tasche
        question: Hatte Ihr Vater eine Tasche dabei?
        unlock: { insight: in_koffer_fehlt }
        responses:
          - mood: ruhig
            text: "Immer. Braunes Leder, mit seinen Initialen. Die hat ihm meine Mutter geschenkt. Ohne die Tasche ist er nirgendwo hingegangen."
      - id: handy
        question: Kennen Sie die PIN seines Handys?
        responses:
          - mood: kooperativ
            text: "Er hat für alles meinen Geburtstag genommen, Tag und Monat. Ich habe ihm hundertmal gesagt, das ist unsicher. Ich bin am dritten November geboren."
      - id: kahl
        question: Kennen Sie Benedikt Kahl?
        unlock: { insight: in_kahl_halvenstedt }
        responses:
          - mood: ruhig
            text: "Papas Büroleiter. Er war immer da, immer freundlich. Papa sagte, er sei der Einzige, auf den er sich blind verlassen könne."

  - character: achterberg
    intro: Miriam Achterberg sitzt sehr gerade. Sie hat ihren Anwalt nicht mitgebracht – noch nicht.
    topics:
      - id: abend
        question: Wann haben Sie Dr. Selbig zuletzt gesehen?
        responses:
          - when: { insight: in_achterberg_weg }
            mood: nervoes
            stress: 40
            text: "Um 23:03 am Bahnhof, wie gesagt. Wir … haben im Auto gestritten. Über seine Anteile. Er war heute ohnehin außer sich – wegen einer E-Mail der Bank, die liegt noch in seinem Büro."
          - mood: ruhig
            text: "Ich habe ihn nach unserem Abendtermin zum Bahnhof gefahren und bin nach Hause. Er war heute sehr angespannt – wegen irgendeiner E-Mail der Bank. Sie liegt noch in seinem Büro, ich gebe Ihnen eine Kopie."
      - id: kanzlei
        question: Wie liefen die Geschäfte der Kanzlei?
        responses:
          - mood: kooperativ
            text: "Gut, aber altmodisch. Konrad hat jede Rechnung selbst abgezeichnet. Sie können gern unsere Buchhaltung sehen – hier, die aktuellen Spesenabrechnungen, wenn Sie wollen."
      - id: anteile
        question: Sie wollten Selbig aus der Kanzlei drängen?
        responses:
          - mood: arrogant
            stress: 30
            text: "Ich wollte seine Anteile kaufen, zu einem fairen Preis. Das ist kein Mordmotiv, das ist Unternehmertum. Außerdem: Mit Konrads Tod erbt seine Tochter die Anteile – nicht ich."
      - id: kahl
        question: Was halten Sie von Benedikt Kahl?
        unlock: { insight: in_bank_rueckfrage }
        responses:
          - mood: ruhig
            text: "Fleißig. Zu fleißig vielleicht. Er hatte Vollmacht für das Treuhandkonto – Konrad hat ihm alles anvertraut."

  - character: grevenbroich
    intro: Grevenbroich reicht den Ermittlern die Hand, als wären sie alte Kollegen.
