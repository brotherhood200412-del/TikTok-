solution:
  culprit: kahl
  headline: Benedikt Kahl – der loyale Büroleiter erschlug seinen Chef, um eine Veruntreuung zu vertuschen.
  motive: Kahl hatte über seine Scheinfirma BK Consulting 48.500 € vom Treuhandkonto abgezweigt. Selbig erfuhr es am Nachmittag von der Bank und stellte ihn im Zug zur Rede – er wollte am nächsten Morgen Anzeige erstatten.
  method: Kahl begleitete Selbig zum Zug, spendierte ihm einen Kaffee und setzte sich ihm im Abteil gegenüber. Nach dem Streit griff er um 23:47 zum Nothammer an der Wand und schlug zu. Er zog den Vorhang zu, hängte das „Bitte nicht stören“-Schild auf, nahm die Aktentasche mit den Bankunterlagen und stieg in Kalten aus. Hammer und leere Tasche warf er in den Mülleimer, dann fuhr er mit dem Taxi nach Brückenau. Sein Alibi – „pünktlich um 23:31 in Brückenau ausgestiegen“ – hatte er sich vorher zurechtgelegt. Er wusste nicht, dass der Zug an diesem Abend neun Minuten Verspätung hatte.
  summary: Kahl gab vor, um 23:31 in Brückenau ausgestiegen zu sein – doch der Zug war erst um 23:40 dort, und aus Wagen 1 stieg niemand aus. Selbigs letzte Nachricht nennt Kahl als Gegenüber. Kahls Firmenkarte bezahlte die beiden Kaffees und das Taxi ab Kalten, die Nachbarin sah ihn um 00:20 heimkommen. Die Wollfasern am Nothammer und 48.500 veruntreute Euro schließen den Fall.
  keyInsights: [in_kahl_luegt, in_niemand_ausgestiegen, in_nachricht_2335, in_kahl_taxi, in_veruntreuung, in_tatwaffe]
  chain:
    - { insight: in_verspaetung, explanation: "Der Zug fuhr neun Minuten zu spät ab – alle Halte verschoben sich." }
    - { insight: in_kahl_luegt, explanation: "Kahl behauptete, „pünktlich um 23:31“ ausgestiegen zu sein. Er kannte die Verspätung nicht, weil er in Brückenau gar nicht ausstieg." }
    - { insight: in_niemand_ausgestiegen, explanation: "Kamera und Zeuge: In Brückenau öffnete sich keine Tür von Wagen 1." }
    - { insight: in_nachricht_2335, explanation: "Um 23:35 schrieb Selbig: „Kahl sitzt mir gegenüber.“" }
    - { insight: in_kalten_mann, explanation: "In Kalten stieg ein Mann im grauen Mantel mit Selbigs Aktentasche aus." }
    - { insight: in_kahl_taxi, explanation: "Das Taxi ab Kalten wurde mit Kahls Firmenkarte bezahlt." }
    - { insight: in_tatwaffe, explanation: "Hammer und leere Tasche lagen genau dort, wo der Mann stehen blieb." }
    - { insight: in_veruntreuung, explanation: "48.500 € vom Treuhandkonto an Kahls Firma – das Motiv." }
  truthTimeline:
    - { time: "16:12", text: "Die Bank fragt Selbig nach Überweisungen an die BK Consulting." }
    - { time: "23:03", text: "Achterberg setzt Selbig am Bahnhof ab." }
    - { time: "23:09", text: "Kahl kauft zwei Kaffee mit seiner Firmenkarte und wartet mit Selbig." }
    - { time: "23:26", text: "Abfahrt mit neun Minuten Verspätung. Kahl sitzt Selbig im Abteil gegenüber." }
    - { time: "23:35", text: "Selbig schreibt seiner Tochter: „Kahl sitzt mir gegenüber.“" }
    - { time: "23:40", text: "Halt in Brückenau. Kahl steigt nicht aus." }
    - { time: "23:47", text: "Kahl erschlägt Selbig mit dem Nothammer." }
    - { time: "23:53", text: "Kahl verlässt in Kalten den Zug und entsorgt Hammer und Tasche." }
    - { time: "23:58", text: "Taxi von Kalten nach Brückenau, bezahlt mit Karte ****4471." }
    - { time: "00:18", text: "Renner findet die Leiche bei der Endkontrolle." }
  redHerrings:
    - { character: duran, clue: "Lautstarker Streit am Bahnsteig, starkes Motiv", debunkedBy: in_kein_wechsel, explanation: "Sie saß in Wagen 2. Die Übergangstür war gesperrt, in Brückenau wechselte niemand den Wagen." }
    - { character: renner, clue: "Generalschlüssel und Leichenfund", debunkedBy: in_renner_wagen2, explanation: "Er war bis Kalten nachweislich in Wagen 2 – sein einziges Vergehen war, das Abteil nicht zu öffnen." }
    - { character: lara, clue: "Die Erbin wartete allein am Bahnhof", debunkedBy: in_lara_dornfelde, explanation: "Ihr Parkticket in Dornfelde belegt, dass sie nicht im Zug war." }
    - { character: achterberg, clue: "Die Partnerin, die ihn loswerden wollte", debunkedBy: in_achterberg_weg, explanation: "Sie fuhr um 23:04 vom Bahnhof weg und stieg nie in den Zug." }
  epilogue: Kahl legte noch in derselben Nacht ein Geständnis ab. Die Bankunterlagen fand die Polizei in seinem Kaminofen – halb verbrannt, aber lesbar. Lara Selbig verkaufte die Kanzleianteile an Miriam Achterberg und spendete den Erlös einer Stiftung für junge Erfinderinnen. Die erste Spende ging an Elif Duran.
