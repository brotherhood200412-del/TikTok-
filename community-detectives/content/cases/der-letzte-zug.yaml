    text: Laut Handelsregister ist Benedikt Kahl alleiniger Geschäftsführer der BK Consulting UG mit Sitz in Brückenau.
    category: identitaet
    characters: [kahl]
  - id: in_veruntreuung
    title: 48.500 Euro veruntreut
    text: Vom Treuhandkonto flossen in fünf Überweisungen insgesamt 48.500 € an die BK Consulting – an Kahl.
    category: motiv
    characters: [kahl]
  - id: in_tatwaffe
    title: Fund im Mülleimer
    text: Im Mülleimer am Bahnsteig Kalten liegen der Nothammer mit Blutspuren und Selbigs leere Aktentasche. Die Bankunterlagen fehlen.
    category: wendung
  - id: in_wollfasern
    title: Graue Wollfasern
    text: Am Griff des Nothammers haften graue Wollfasern – wie von einem Wollmantel.
    category: spur
    characters: [kahl]
  - id: in_renner_wagen2
    title: Renner war in Wagen 2
    text: Laut Kontrollgerät und Elif Duran war Renner von 23:41 bis 23:52 in Wagen 2. Wegen der klemmenden Tür kam er erst in Kalten über den Bahnsteig in Wagen 1.
    category: entlastung
    characters: [renner]
  - id: in_lara_dornfelde
    title: Lara wartete in Dornfelde
    text: Laras Parkticket in Dornfelde ist um 23:58 Uhr gezogen. Dornfelde liegt 40 Bahnminuten hinter Kalten – sie war nie im Zug.
    category: entlastung
    characters: [lara]
  - id: in_achterberg_weg
    title: Achterberg fuhr sofort weg
    text: Die Bahnhofskamera zeigt Achterbergs silbernen Volvo um 23:03 Uhr ankommen und um 23:04 Uhr wieder abfahren. Sie stieg nicht in den Zug.
    category: entlastung
    characters: [achterberg]
  - id: in_duran_streit
    title: Streit am Bahnsteig
    text: Um 23:12 Uhr streiten Elif Duran und Selbig lautstark am Bahnsteig. Duran steigt danach in Wagen 2.
    category: motiv
    characters: [duran]
    timeline: { time: "23:12", sort: 20, text: "Elif Duran streitet mit Selbig und steigt in Wagen 2." }

