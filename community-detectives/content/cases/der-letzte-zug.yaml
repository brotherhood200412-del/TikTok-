    title: Rückfrage der Bank
    text: Am Nachmittag fragte die Bank bei Selbig nach auffälligen Überweisungen vom Treuhandkonto an eine „BK Consulting UG“. Selbig antwortete, er kläre das „heute Abend persönlich“.
    category: motiv
    characters: [selbig]
  - id: in_bk_kahl
