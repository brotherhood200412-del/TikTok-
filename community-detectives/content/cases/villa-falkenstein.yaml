  - id: ev_tagebuch
    title: Henriettes Tagebuch
    summary: Die letzten beiden Einträge. Eine Zeile ist verschlüsselt.
    source: Bibliothek
    content:
      kind: document
      docType: diary
      heading: Tagebuch H. v. F.
      lines:
        - { id: tb1, text: "Freitag. Johann war hier. Ich habe ihm gesagt: Am Sonntag sage ich ihnen die Wahrheit – über mein Testament. Er sah erleichtert aus." }
        - { id: tb2, text: "Verschlüsselt, wie immer verschoben um Albrechts Glückszahl:" }
        - { id: tb3, text: "RVUZAHUAPUZ CHALY PZA QVOHUU" }
        - { id: tb4, text: "Samstag, 22:40. Die Kerzen haben heute so seltsame gelbe Höfe." }
        - { id: tb5, text: "Mir ist übel. Der Kakao war heute so bitter – Moritz hat es gut gemeint." }
        - { id: tb6, text: "Morgen werde ich achtzig. Ich bin müde, aber ich habe meinen Frieden gemacht." }
    hotspots:
