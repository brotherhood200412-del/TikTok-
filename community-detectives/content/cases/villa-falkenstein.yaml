        - { id: kr2, text: "Frau Valerie fuhr um Viertel vor neun ab, ins Hotel." }
        - { id: kr3, text: "Um 21:20 stand der junge Herr Moritz in der Küche und machte Milch warm. Wie jeden Abend für den Kakao der gnädigen Frau." }
        - { id: kr4, text: "Um 22:00 hörte ich, wie die gnädige Frau die Bibliothek abschloss. Zweimal herumgedreht, wie immer." }
        - { id: kr5, text: "Um 23:00 habe ich den Schlüsselschrank versiegelt und bin zu Bett gegangen." }
