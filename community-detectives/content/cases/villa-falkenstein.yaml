interrogations:
  - character: konstantin
    intro: Konstantin läuft im Salon auf und ab. Seine Knöchel sind vom Aufbrechen der Tür noch aufgeschürft.
    topics:
      - id: tuer
        question: Erzählen Sie vom Sonntagmorgen.
        responses:
          - mood: verzweifelt
            stress: 30
            text: "Paula hat um halb acht geklopft, nichts. Ich habe gerufen, nichts. Um Viertel nach acht habe ich die Tür eingetreten. Der Schlüssel steckte innen. Sie saß einfach da, als würde sie schreiben."
      - id: streit
        question: Worüber haben Sie beim Abendessen gestritten?
        responses:
          - when: { insight: in_konstantin_bezahlt }
            mood: gebrochen
            stress: 40
            text: "Sie hat es also unterschrieben. Sie wollte meine Schulden bezahlen – am Montag. Ich habe sie angeschrien, weil ich mich so geschämt habe. Ich wollte ihr Geld nicht. Und jetzt ist es zu spät."
          - mood: wuetend
            stress: 55
            text: "Geld. Was sonst. Die Werft. Das geht niemanden etwas an. Aber in ihrem Schreibtisch werden Sie sicher Papiere finden, die Sie interessieren."
      - id: abend
        question: Wo waren Sie nach dem Abendessen?
        responses:
          - mood: ruhig
            text: "Im Bootshaus. Ich schlafe dort, wenn ich wütend bin. Das wissen alle. Zeugen gibt es keine, außer den Enten."
      - id: geld
        question: Wovon leben Sie und Ihr Sohn?
        unlock: { phase: familie }
        responses:
          - mood: ausweichend
            stress: 30
            text: "Ich von der Werft – theoretisch. Moritz von der Familienstiftung. Wie wir alle, irgendwie. Albrechts Stiftung hält diese Familie zusammen."
      - id: vater
        question: Wussten Sie, dass Albrecht nicht Ihr leiblicher Vater war?
        unlock: { insight: in_geheimnis_vater }
        responses:
          - mood: gebrochen
            stress: 70
            text: "… Was? Nein. Das ist … Johann? Der alte Johann? … Mein Gott. Sie hat es mir nie gesagt. Sie wollte es mir nie sagen, oder?"

  - character: valerie
    intro: Valerie sitzt mit übereinandergeschlagenen Beinen da und mustert die Ermittler wie einen Kunden mit gefälschtem Rezept.
    topics:
      - id: abend
        question: Warum haben Sie im Hotel übernachtet?
        responses:
          - mood: ausweichend
            stress: 20
            text: "Private Gründe. Ich bin um Viertel vor neun gefahren und war ab kurz nach neun im Hotel Seeblick. Der Nachtportier kann das bestätigen."
      - id: medikamente
        question: Welche Medikamente nahm Ihre Mutter?
        responses:
          - mood: kooperativ
            text: "Digoxin, Ramipril, ASS. Digoxin ist tückisch – schon die mehrfache Dosis ist tödlich. Den Beipackzettel habe ich hier, falls Sie die Symptome einer Überdosis nachlesen wollen."
      - id: packung
        question: Haben Sie Digoxin mitgebracht?
        responses:
          - mood: ruhig
            text: "Ja, am Freitag. Eine neue Packung, versiegelt, liegt in der Küchenschublade. Paula braucht sie erst nächste Woche."
      - id: verdacht
        question: Sie sind Apothekerin. Sie hätten das Wissen.
        unlock: { insight: in_digoxin }
        responses:
          - when: { insight: in_tabletten_fehlen }
            mood: wuetend
            stress: 50
            text: "Zwölf Tabletten aus einer Packung, die ich selbst gekauft habe, mit meinem Namen auf der Rechnung? Wenn ich jemanden vergiften wollte, wäre ich nicht so dumm. Suchen Sie lieber nach dem, der sie herausgedrückt hat."
          - mood: arrogant
            stress: 35
            text: "Wissen haben heute alle. Es steht auf jedem Beipackzettel. Und ich war im Hotel."

  - character: moritz
    intro: Moritz hat verweinte Augen. Er dreht unablässig ein Plektrum zwischen den Fingern.
    topics:
      - id: kakao
        question: Sie haben Ihrer Großmutter den Kakao gebracht?
        responses:
          - when: { insight: in_kakao_gespuelt }
            mood: nervoes
            stress: 60
            text: "Ja, ich … ich habe die Tasse gespült. Ich wollte Krämer Arbeit abnehmen. Ist das jetzt verboten? Sie hat gesagt, er war ein bisschen bitter. Ich hatte zu wenig Zucker genommen."
          - mood: kooperativ
            stress: 10
            text: "Jeden Abend, seit ich sechs bin. Um halb zehn, im Salon. Sie hat gelacht und gesagt, ich sei der Einzige, der ihn richtig macht."
      - id: abend
        question: Was haben Sie danach gemacht?
        responses:
          - mood: ruhig
            text: "In meinem Zimmer Gitarre gespielt. Kopfhörer auf. Ich habe nichts gehört."
      - id: dachboden
        question: Waren Sie in letzter Zeit auf dem Dachboden?
        unlock: { insight: in_plektrum }
        responses:
          - mood: ausweichend
            stress: 70
            text: "Vielleicht. Ich suche da manchmal alte Platten von Opa. Plektren verliere ich überall."
      - id: geld
        question: Wovon leben Sie?
        unlock: { phase: familie }
        responses:
          - mood: nervoes
            stress: 30
            text: "Von der Stiftung. Die Band verdient nichts. Ohne Opas Stiftung könnte ich gleich aufhören. Warum fragen Sie das?"
      - id: abdruck
        question: Ihr Fingerabdruck ist auf dem Blister.
        unlock: { insight: in_abdruck_moritz }
        responses:
          - when: { insight: in_rede_keine_enthuellung }
            mood: gebrochen
            stress: 100
            text: "Sie wollte es gar nicht sagen? … Sie wollte Papa helfen? … Ich habe gehört ‚am Sonntag sage ich ihnen die Wahrheit‘ und dachte … ich dachte, sie zerstört alles. Ich habe zwölf Tabletten in den Kakao gerührt. Für nichts. Für gar nichts."
          - when: { insight: in_moritz_motiv }
            mood: verzweifelt
            stress: 95
            text: "Sie wollte uns alles nehmen! Am Sonntag, vor allen! Papa wäre zerbrochen. Ich wollte doch nur … ich wollte, dass sie schweigt."
          - mood: wuetend
            stress: 85
            text: "Ich habe die Packung vielleicht mal angefasst, als ich Zucker gesucht habe. Das beweist gar nichts!"

  - character: paula
    intro: Paula sitzt aufrecht, die Hände im Schoß verkrampft. Sie hat nicht geschlafen.
    topics:
      - id: abend
        question: Wie ging es Henriette am Abend?
        responses:
          - mood: wuetend
            stress: 20
            text: "Gut! Das sage ich doch die ganze Zeit. Sie war klar, sie war kräftig, sie hat sich auf ihre Rede gefreut. So stirbt niemand ‚einfach so‘ in derselben Nacht."
      - id: medikamente
        question: Wer stellt die Medikamente zusammen?
        responses:
          - mood: kooperativ
            text: "Ich, jeden Sonntag. Die Dosette steht in ihrem Zimmer, sie können sie gern untersuchen lassen. Ich habe nichts falsch gemacht."
      - id: kueche
        question: Haben Sie am Abend jemanden in der Küche gesehen?
        unlock: { phase: familie }
        responses:
          - mood: ruhig
            text: "Um Viertel vor zehn Moritz. Er hat die Kakaotasse gespült, von Hand. Ich habe noch gescherzt, ob er krank sei. Er hat nicht gelacht."
      - id: erbe
        question: Sie stehen im neuen Testament.
        unlock: { insight: in_notartermin }
        responses:
          - mood: verzweifelt
            stress: 45
            text: "Ich weiß. Zwanzigtausend Euro. Ich habe ihr gesagt, ich will das nicht. Genau deshalb hatte ich Angst, dass Sie mich verdächtigen."

  - character: wiesinger
    intro: Dr. Wiesinger sitzt in Henriettes Ohrensessel und sieht plötzlich sehr alt aus.
    topics:
      - id: totenschein
        question: Warum haben Sie so schnell einen natürlichen Tod festgestellt?
        responses:
          - when: { insight: in_digoxin }
            mood: gebrochen
            stress: 60
            text: "Gelbsehen … Sie haben recht. Ich hätte es sehen müssen. Ich habe sie gesehen und nur noch an … an unsere Vergangenheit gedacht. Ich war ein schlechter Arzt an diesem Morgen."
          - mood: ruhig
            stress: 20
            text: "Sie war 79 und herzkrank. Ich kenne ihr Herz seit fünfzig Jahren. Es war müde."
      - id: abend
        question: Wo waren Sie am Samstagabend?
        responses:
          - mood: kooperativ
            text: "Notdienst. Bei der alten Frau Lindner im Dorf, von neun bis halb zwölf. Henriette hat mich dort um Viertel nach zehn angerufen. Sie sagte, ihr sei etwas übel, aber das sei die Aufregung."
      - id: anruf
        question: Worüber haben Sie um 22:15 Uhr gesprochen?
        unlock: { insight: in_anruf_2215 }
        responses:
          - mood: verzweifelt
            stress: 40
            text: "Sie sagte: ‚Johann, ich sage es ihnen nicht. Ich nehme es mit.‘ Und dass ihr übel sei und sie farbige Ringe um die Kerzen sehe. Ich habe gesagt, sie solle schlafen gehen. Ich habe nicht nachgedacht."
      - id: vergangenheit
        question: Wer ist „J.“ in den Briefen von 1971?
        unlock: { insight: in_briefe_1971 }
        responses:
          - mood: gebrochen
            stress: 70
            text: "Ich. Konstantin ist mein Sohn. Fünfzig Jahre habe ich geschwiegen. Henriette wollte es am Freitag nicht enthüllen – sie wollte ihm nur ihr Geld schenken, damit die Stiftung nie mehr eine Rolle spielt."

  - character: kraemer
    intro: Krämer steht, obwohl ihm ein Stuhl angeboten wird. Er trägt schwarze Handschuhe.
    topics:
      - id: abend
        question: Was haben Sie am Abend beobachtet?
        responses:
          - mood: ruhig
            text: "Alles Wesentliche steht in meiner Aussage. Wenn Sie erlauben: Ich kenne die Zeiten dieses Hauses auf die Minute."
      - id: schluessel
        question: Wer hat Schlüssel zur Bibliothek?
        responses:
          - mood: kooperativ
            text: "Die gnädige Frau selbst. Und der Zweitschlüssel im Schlüsselschrank, den ich jede Nacht versiegle. Mein Siegelbuch steht Ihnen zur Verfügung."
      - id: kamin
        question: Haben Sie am Sonntag etwas entsorgt?
        unlock: { minutes: 1 }
        responses:
          - mood: ruhig
            text: "Ich räume am Sonntag die Kamine aus. Im Salon lagen Papierreste. Ich habe sie aufbewahrt – ich werfe in diesem Haus nie etwas Geschriebenes weg."
      - id: familie
        question: Kennen Sie die Geheimnisse der Familie?
        unlock: { insight: in_geheimnis_vater }
        responses:
          - mood: ausweichend
            stress: 30
            text: "Ich habe einunddreißig Jahre lang nichts gesehen und nichts gehört. Das ist mein Beruf. Aber dass der Herr Doktor und die gnädige Frau … nun. Das wusste ich."

puzzles:
  - id: p_zimmer
    title: Das verschlossene Zimmer
    type: logic
    prompt: Wie wurde die Bibliothek in der Nacht verschlossen?
    evidence: [ev_bibliothek, ev_siegelbuch, ev_aussage_kraemer]
    unlock: { all: [{ insight: in_schluessel_innen }, { insight: in_fenster_verriegelt }, { insight: in_zweitschluessel_versiegelt }] }
    input:
      kind: choice
      options:
        - { id: z_zweit, label: "Jemand schloss mit dem Zweitschlüssel von außen ab" }
        - { id: z_fenster, label: "Der Täter floh durch das Fenster" }
        - { id: z_selbst, label: "Henriette schloss selbst von innen ab – sie war allein" }
        - { id: z_tuer, label: "Konstantin schloss beim Aufbrechen nachträglich ab" }
    answer: { choice: z_selbst }
    hints:
      - Der Zweitschlüssel war versiegelt, das Fenster unberührt. Krämer hörte um 22 Uhr den Schlüssel.
      - Wenn niemand bei ihr war – dann muss das Gift sie schon vorher erreicht haben.
    reveals: [in_allein_eingeschlossen]
    success: Henriette war allein. Das verschlossene Zimmer ist kein Tatort – der Mord geschah früher.

  - id: p_tabletten
    title: Die angebrochene Packung
    type: compare
    prompt: Wie viele Tabletten fehlen aus der neuen Digoxin-Packung?
    evidence: [ev_blister]
    unlock: { evidence: ev_blister }
    input: { kind: text, placeholder: "Anzahl" }
    answer: { accept: ["12", "zwölf", "zwoelf"] }
    hints:
      - Jeder Streifen hat zehn Tabletten. Zählt nur die Streifen, in denen etwas fehlt.
      - "Streifen 4: 7 fehlen. Streifen 5: 5 fehlen."
    reveals: [in_tabletten_fehlen]
    success: Zwölf Tabletten – das Zwölffache der Tagesdosis. Aus einer Packung, die noch niemand hätte öffnen sollen.

  - id: p_chiffre
    title: Henriettes Chiffre
    type: cipher
    prompt: "Henriette verschlüsselte private Zeilen „wie immer verschoben um Albrechts Glückszahl“. Entschlüsselt RVUZAHUAPUZ CHALY PZA QVOHUU. Wer ist gemeint? (Name eingeben)"
    evidence: [ev_tagebuch, ev_portraet]
    unlock: { evidence: ev_tagebuch }
    input: { kind: text, placeholder: "Name" }
    answer: { accept: ["Johann", "Johann Wiesinger", "Wiesinger", "Dr. Johann Wiesinger", "Konstantins Vater ist Johann", "Dr. Wiesinger"] }
    hints:
      - Albrechts Glückszahl steht auf der Plakette unter seinem Porträt im Salon.
      - "Jeder Buchstabe ist um 7 Stellen im Alphabet nach hinten verschoben: R → K, V → O …"
      - "KONSTANTINS VATER IST …"
    reveals: [in_geheimnis_vater]
    success: "„Konstantins Vater ist Johann.“ – Henriettes größtes Geheimnis."

  - id: p_abend
    title: Der letzte Abend
    type: order
    prompt: Bringt die Ereignisse des Samstagabends in die richtige Reihenfolge.
    evidence: [ev_aussage_kraemer, ev_aussage_paula, ev_telefon, ev_tagebuch]
    unlock: { all: [{ insight: in_moritz_kueche }, { insight: in_eingeschlossen_2200 }] }
    input:
      kind: order
      items:
        - { id: a_tagebuch, label: "Letzter Tagebucheintrag" }
        - { id: a_milch, label: "Moritz macht Milch warm" }
        - { id: a_valerie, label: "Valerie fährt ins Hotel" }
        - { id: a_abschliessen, label: "Henriette schließt die Bibliothek ab" }
        - { id: a_spuelen, label: "Moritz spült die Tasse" }
        - { id: a_anruf, label: "Anruf bei Dr. Wiesinger" }
    answer: { order: [a_valerie, a_milch, a_spuelen, a_abschliessen, a_anruf, a_tagebuch] }
    hints:
      - Krämer, Paula, der Verbindungsnachweis und das Tagebuch nennen alle Uhrzeiten.
      - "20:45 – 21:20 – 21:45 – 22:00 – 22:15 – 22:40."
    reveals: [in_abend_rekonstruiert]
    success: Nach 22 Uhr kam niemand mehr an sie heran. Die einzige Gelegenheit war der Kakao.

  - id: p_abdruck
    title: Der Teilabdruck
    type: image
    prompt: Wem gehört der Teilabdruck auf Blisterstreifen 5?
    evidence: [ev_labor, ev_vergleich]
    unlock: { evidence: ev_vergleich }
    input:
      kind: choice
      options:
        - { id: f_konstantin, label: Konstantin von Falkenstein }
        - { id: f_valerie, label: Valerie Falkenstein-Roth }
        - { id: f_moritz, label: Moritz von Falkenstein }
        - { id: f_paula, label: Paula Brandt }
        - { id: f_wiesinger, label: Dr. Johann Wiesinger }
    answer: { choice: f_moritz }
    hints:
      - Vergleicht Grundmuster, Anzahl der Gabelungen und Besonderheiten.
      - Zwei Personen haben „Schleife rechts, 3 Gabelungen“ – aber nur eine die Narbe.
    reveals: [in_abdruck_moritz]
    success: Schleife rechts, drei Gabelungen, eine quer verlaufende Narbe – die Narbe der gerissenen Gitarrensaite.

events:
  - id: ev_obduktion
    title: Die Staatsanwaltschaft ordnet die Obduktion an
    source: Staatsanwaltschaft
    text: Angesichts der Symptome im Tagebuch wird der Totenschein zurückgezogen. Die Rechtsmedizin arbeitet die Nacht durch.
    trigger: { when: { insight: in_digoxin } }
  - id: ev_kamin
    title: Papierreste im Kamin
    source: Eduard Krämer
    text: "Krämer bringt einen Umschlag: „Die Reste aus dem Salonkamin. Ich dachte, Sie sollten das sehen – die gnädige Frau hat Samstagnachmittag einen Entwurf verbrannt und neu geschrieben.“"
    trigger: { minutes: 35, when: { phase: familie } }
  - id: ev_jana_meldet
    title: Jana Rehm meldet sich
    source: Hinweistelefon
    text: "Eine junge Frau ruft weinend an: „Ich bin Moritz' Freundin. Er hat mir Samstagnacht etwas geschrieben, das mir keine Ruhe lässt. Ich schicke Ihnen den Verlauf.“"
    trigger: { when: { all: [{ insight: in_kakao_giftraeger }, { insight: in_tabletten_fehlen }] } }
  - id: ev_paula_erinnert
