  - id: ev_beipackzettel
    title: Beipackzettel Digoxin
    summary: Aus Valeries Apothekentasche – sie hat ihn bereitwillig vorgelegt.
    source: Valerie Falkenstein-Roth
    unlock: { topic: valerie.medikamente }
    content:
      kind: document
      docType: report
      heading: Gebrauchsinformation – Digoxin 0,1 mg
      lines:
        - { id: bz1, text: "Anwendung: Herzschwäche, Vorhofflimmern. Täglich 1 Tablette." }
        - { id: bz2, text: "Geringe therapeutische Breite: Schon die mehrfache Dosis kann lebensgefährlich sein." }
        - { id: bz3, text: "Zeichen einer Überdosierung: Übelkeit, Erbrechen, Sehstörungen (Gelb- oder Grünsehen, farbige Höfe um Lichtquellen)," }
        - { id: bz4, text: "Herzrhythmusstörungen, Herzstillstand – häufig mehrere Stunden nach der Einnahme." }
        - { id: bz5, text: "Bitterer Geschmack beim Zerkleinern der Tabletten möglich." }

