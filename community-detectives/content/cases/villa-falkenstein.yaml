# COMMUNITY DETECTIVES – Fall: Das Geheimnis der Villa Falkenstein
# Alle Personen, Orte und Unternehmen sind frei erfunden.
id: villa-falkenstein
version: 1
title: Das Geheimnis der Villa Falkenstein
tagline: Ein verschlossenes Zimmer, ein natürlicher Tod – und eine Familie, die zu viel zu verlieren hat.
genre: mysterioes
difficulty: experte
tier: creator
estimatedMinutes: 100
accent: "#6b4f8a"

briefing:
  location: Villa Falkenstein am Rauhsee, Seeberg
  date: Sonntag, 15. Juni – der 80. Geburtstag
  intro: |
    Die ganze Familie ist angereist: Henriette von Falkenstein wird achtzig. Für Sonntagmittag ist ein Fest geplant, Henriette hat eine Rede angekündigt – „über Dinge, die ich euch lange schuldig geblieben bin“.
    Am Sonntagmorgen öffnet niemand die Bibliothek. Um 8:15 Uhr bricht ihr Sohn Konstantin die Tür auf. Henriette sitzt tot an ihrem Schreibtisch. Die Tür war von innen verschlossen, der Schlüssel steckte, das Fenster ist verriegelt.
    Der Hausarzt Dr. Wiesinger stellt um 8:50 Uhr den Totenschein aus: Herzversagen, natürlicher Tod. Henriette war herzkrank.
    Doch die Pflegerin Paula Brandt besteht darauf, dass Henriette am Abend „vollkommen klar und kräftig“ war. Die Familie will die Sache auf sich beruhen lassen. Ihr nicht.
  objective: Klärt, ob Henriette eines natürlichen Todes starb. Wenn nicht – wie konnte jemand in ein verschlossenes Zimmer hinein töten?
  question: Wer ist für den Tod von Henriette von Falkenstein verantwortlich?

phases:
  - id: bibliothek
    title: Das verschlossene Zimmer
    goal: Untersucht die Bibliothek. War es wirklich ein natürlicher Tod – und wie war das Zimmer verschlossen?
  - id: familie
    title: Die Familie
    goal: Wer war am Samstagabend wo? Rekonstruiert die letzten Stunden der Henriette von Falkenstein.
  - id: wahrheit
    title: Die alte Wahrheit
    goal: Welches Geheimnis wollte Henriette an ihrem Geburtstag lüften – und wer konnte das nicht ertragen?

characters:
  - id: henriette
    name: Henriette von Falkenstein
    role: victim
    age: 79
    occupation: Herrin der Villa Falkenstein
    color: "#6b4f8a"
    profile: Seit dem Tod ihres Mannes Albrecht (2009) führt sie die Familienstiftung. Herzkrank, nimmt täglich Digoxin. Schreibt jeden Abend Tagebuch – private Stellen verschlüsselt.
    personality: Scharfsinnig, stolz, liebevoll auf ihre eigene, strenge Art.
    relation: Das Opfer.
    secret: Konstantin ist nicht Albrechts leiblicher Sohn, sondern der von Dr. Johann Wiesinger. Sie wollte das Geheimnis für immer bewahren.
  - id: konstantin
    name: Konstantin von Falkenstein
    role: suspect
    age: 52
    occupation: Unternehmer, ältester Sohn
    color: "#7a6a4f"
    profile: Betreibt eine Bootswerft am See, die kurz vor der Pleite steht. Hat 180.000 Euro Schulden.
    personality: Laut, impulsiv, unter der Oberfläche unsicher.
    relation: Sohn. Hat die Tür zur Bibliothek aufgebrochen.
    alibi: War nach dem Abendessen im Bootshaus und hat dort übernachtet.
    motive: Massive Schulden; lauter Streit mit der Mutter beim Abendessen.
    secret: Weiß nichts von seiner Herkunft. Seine Mutter hatte ihm beim Streit versprochen, die Schulden am Montag zu begleichen – er schämt sich und schweigt darüber.
  - id: valerie
    name: Valerie Falkenstein-Roth
    role: suspect
    age: 48
    occupation: Apothekerin
    color: "#4f6a7a"
    profile: Betreibt eine Apotheke in der Stadt. Hat ihrer Mutter am Freitag eine neue Packung Digoxin mitgebracht.
    personality: Kontrolliert, sachlich, distanziert zur Familie.
    relation: Tochter.
    alibi: Hat die Villa um 20:45 Uhr verlassen und im Hotel Seeblick übernachtet.
    motive: Erbt viel; hat Zugang zu Medikamenten und das Wissen.
    secret: Ihre Ehe ist am Ende, sie wollte die Familie nicht damit belasten und übernachtete deshalb im Hotel.
  - id: moritz
    name: Moritz von Falkenstein
    role: suspect
    age: 24
    occupation: Musiker, Enkel
    color: "#5a7a4f"
    profile: Konstantins Sohn, Gitarrist in einer Band. Henriettes Lieblingsenkel. Lebt von den Erträgen der Familienstiftung. Eine Narbe quer über dem rechten Zeigefinger erinnert an eine gerissene Saite.
    personality: Charmant, sensibel, wirkt jünger als er ist.
    relation: Enkel. Brachte der Großmutter jeden Abend ihren Kakao.
    alibi: War nach dem Kakao in seinem Zimmer und hat Gitarre geübt.
    motive: Keines erkennbar – er liebte seine Großmutter.
    secret: Hat am Freitag ein Gespräch belauscht und alte Briefe gefunden. Er glaubte, Henriette würde am Geburtstag enthüllen, dass Konstantin nicht Albrechts Sohn ist – damit wären Vater und Sohn aus der Stiftung gefallen. Er vergiftete sie mit Digoxin im Kakao.
  - id: paula
    name: Paula Brandt
    role: suspect
    age: 31
    occupation: Pflegerin, wohnt in der Villa
    color: "#7a4f4f"
    profile: Pflegt Henriette seit drei Jahren. Stellt jeden Sonntag die Wochendosette mit den Medikamenten zusammen.
    personality: Gewissenhaft, direkt, lässt sich nichts gefallen.
    relation: Pflegerin, enge Vertraute.
    alibi: War ab 21:30 Uhr in ihrem Zimmer, kam um 21:45 Uhr noch einmal in die Küche.
    motive: Hat jeden Tag Zugang zu Henriettes Medikamenten. Im neuen Testament soll sie bedacht werden.
    secret: Weiß, dass Henriette ihr 20.000 Euro vermachen wollte – sie hat es nie gewollt und fürchtet, deshalb verdächtigt zu werden.
  - id: wiesinger
    name: Dr. Johann Wiesinger
    role: suspect
    age: 81
    occupation: Hausarzt im Ruhestand, Freund der Familie
    color: "#7a7a5a"
    profile: Seit fünfzig Jahren Hausarzt der Falkensteins. Macht noch Notdienste im Dorf.
    personality: Höflich, altmodisch, wirkt müde und traurig.
    relation: Ältester Freund der Familie. Stellte den Totenschein aus.
    alibi: Hatte Notdienst im Dorf.
    motive: Stellte auffällig schnell einen natürlichen Tod fest.
    secret: Ist Konstantins leiblicher Vater. Hat den Totenschein aus Trauer und Gewohnheit zu schnell ausgestellt – nicht, um etwas zu vertuschen.
  - id: kraemer
    name: Eduard Krämer
    role: suspect
    age: 63
    occupation: Verwalter der Villa
    color: "#5d5d5d"
    profile: Seit 31 Jahren im Haus. Verwahrt alle Schlüssel – auch den Zweitschlüssel zur Bibliothek – und versiegelt den Schlüsselschrank jede Nacht.
    personality: Förmlich, verschwiegen, beobachtet alles.
    relation: Verwalter. Kennt jedes Geräusch im Haus.
    alibi: Hat um 23:00 Uhr den Schlüsselschrank versiegelt und ist zu Bett gegangen.
    motive: Besitzt den einzigen Zweitschlüssel zur Bibliothek.
    secret: Hat die Familie über Jahrzehnte gedeckt und weiß mehr über Henriettes Vergangenheit, als er sagt. Unschuldig.

insights:
  - id: in_schluessel_innen
    title: Schlüssel innen
    text: Der Bibliotheksschlüssel steckte von innen im Schloss. Konstantin musste die Tür aufbrechen.
    category: spur
  - id: in_fenster_verriegelt
    title: Fenster verriegelt
    text: Das einzige Fenster der Bibliothek ist von innen verriegelt, die Riegel sind verstaubt und unberührt.
    category: spur
  - id: in_todeszeit_villa
    title: Tod zwischen 1 und 3 Uhr
    text: Laut Totenschein starb Henriette zwischen 1:00 und 3:00 Uhr nachts.
    category: zeitlinie
    timeline: { time: "01:00–03:00", sort: 90, text: "Henriette stirbt allein in der Bibliothek." }
  - id: in_gelbsehen
    title: Gelbe Höfe
    text: "Henriettes letzter Tagebucheintrag: Die Kerzen hätten „seltsame gelbe Höfe“, ihr sei übel."
    category: spur
    characters: [henriette]
  - id: in_kakao_bitter
    title: Der bittere Kakao
    text: "Im Tagebuch: „Der Kakao war heute so bitter – Moritz hat es gut gemeint.“"
    category: spur
    characters: [moritz]
  - id: in_digoxin
    title: Digoxin-Vergiftung
    text: Gelbsehen, Übelkeit, Herzversagen – exakt die Symptome einer Digoxin-Überdosis. Henriette starb nicht einfach an ihrem kranken Herzen.
    category: wendung
  - id: in_obduktion
    title: Neunfacher Digoxin-Spiegel
    text: Die Obduktion zeigt einen neunfach erhöhten Digoxin-Spiegel. Aufgenommen zwischen 21 und 22 Uhr, gelöst in Milch.
    category: wendung
    timeline: { time: "21:00–22:00", sort: 35, text: "Henriette nimmt das Gift mit Milch auf." }
  - id: in_dosette_korrekt
    title: Die Dosette ist korrekt
    text: In Paulas Wochendosette liegen genau die richtigen Tabletten. Samstag früh wurde eine Tablette genommen – wie verordnet. Das Gift kam nicht aus der Dosette.
    category: entlastung
    characters: [paula]
  - id: in_tabletten_fehlen
    title: Zwölf Tabletten fehlen
    text: Aus der neuen, am Freitag versiegelt gekauften Digoxin-Packung fehlen zwölf Tabletten – obwohl sie noch gar nicht gebraucht wurde.
    category: spur
  - id: in_moritz_kueche
    title: Moritz in der Küche
    text: Krämer sah Moritz um 21:20 Uhr in der Küche Milch warm machen – für den allabendlichen Kakao.
    category: zeitlinie
    characters: [moritz]
    timeline: { time: "21:20", sort: 30, text: "Moritz macht in der Küche Milch für den Kakao warm." }
  - id: in_kakao_salon
    title: Kakao im Salon
    text: Um 21:30 Uhr trank Henriette im Salon den Kakao, den Moritz ihr brachte.
    category: zeitlinie
    characters: [moritz]
    timeline: { time: "21:30", sort: 40, text: "Henriette trinkt im Salon Moritz' Kakao." }
  - id: in_kakao_gespuelt
    title: Die gespülte Tasse
    text: Um 21:45 Uhr spülte Moritz die Kakaotasse von Hand – Paula sagt, das habe er noch nie getan.
    category: widerspruch
    characters: [moritz]
    timeline: { time: "21:45", sort: 45, text: "Moritz spült die Kakaotasse von Hand." }
  - id: in_kakao_giftraeger
    title: Das Gift war im Kakao
    text: Bitterer Geschmack, Aufnahme mit Milch zwischen 21 und 22 Uhr, die sofort gespülte Tasse – das Digoxin war im Kakao.
    category: wendung
    characters: [moritz]
  - id: in_eingeschlossen_2200
    title: Um 22 Uhr schloss sie ab
    text: Krämer hörte um 22:00 Uhr, wie Henriette die Bibliothek von innen abschloss – wie immer, wenn sie schrieb.
    category: zeitlinie
    characters: [henriette]
    timeline: { time: "22:00", sort: 50, text: "Henriette schließt sich in der Bibliothek ein." }
  - id: in_anruf_2215
    title: Anruf um 22:15
    text: Um 22:15 Uhr rief Henriette aus der Bibliothek Dr. Wiesinger an. Vier Minuten Gespräch.
    category: zeitlinie
    characters: [wiesinger]
    timeline: { time: "22:15", sort: 55, text: "Henriette telefoniert mit Dr. Wiesinger." }
  - id: in_tagebuch_2240
    title: Letzter Eintrag 22:40
    text: Um 22:40 Uhr schrieb Henriette ihren letzten Tagebucheintrag.
    category: zeitlinie
    timeline: { time: "22:40", sort: 60, text: "Letzter Tagebucheintrag." }
  - id: in_zweitschluessel_versiegelt
    title: Der Zweitschlüssel war versiegelt
    text: Der Schlüsselschrank wurde um 23:00 Uhr mit Plombe 3392 versiegelt. Am Morgen war die Plombe unversehrt. Niemand hat den Zweitschlüssel benutzt.
    category: entlastung
    characters: [kraemer]
  - id: in_allein_eingeschlossen
    title: Kein Mord im verschlossenen Zimmer
    text: Henriette hat sich selbst eingeschlossen. Niemand war bei ihr. Das Gift hatte sie schon vorher aufgenommen – das verschlossene Zimmer ist kein Rätsel, sondern eine Ablenkung.
    category: wendung
  - id: in_abend_rekonstruiert
    title: Der Abend, rekonstruiert
    text: Nach 22:00 Uhr kam niemand mehr an Henriette heran. Die einzige Gelegenheit, ihr etwas zu geben, war der Kakao um 21:30 Uhr.
    category: spur
  - id: in_valerie_hotel
    title: Valerie im Hotel
    text: Valerie checkte um 21:05 Uhr im Hotel Seeblick ein und verließ es laut Nachtportier erst um 8:30 Uhr.
    category: entlastung
    characters: [valerie]
    timeline: { time: "20:45", sort: 20, text: "Valerie verlässt die Villa." }
  - id: in_wiesinger_notdienst
    title: Wiesinger im Notdienst
    text: Dr. Wiesinger war von 21:05 bis 23:35 Uhr bei einer Patientin im Dorf. Das Telefonat um 22:15 führte er von dort.
    category: entlastung
    characters: [wiesinger]
  - id: in_konstantin_bezahlt
    title: Die Schulden wären bezahlt worden
    text: Henriette hatte am Samstag einen Überweisungsauftrag über 180.000 € an Konstantins Gläubiger unterschrieben – fällig Montag. Durch ihren Tod ist der Auftrag ungültig. Konstantin verliert.
    category: entlastung
    characters: [konstantin]
  - id: in_streit_dinner
    title: Streit beim Abendessen
    text: "Beim Abendessen um 19:40 Uhr schrie Konstantin: „Du wirst mich nicht ruinieren!“"
    category: motiv
    characters: [konstantin]
    timeline: { time: "19:40", sort: 10, text: "Lauter Streit zwischen Konstantin und Henriette beim Abendessen." }
  - id: in_notartermin
    title: Termin beim Notar
    text: Für Montag 10 Uhr war ein Notartermin vereinbart – Testamentsänderung und eine Schenkung „an Ihren Sohn“.
    category: motiv
    characters: [konstantin]
  - id: in_stiftung_leiblich
    title: Nur leibliche Nachkommen
    text: Laut Stiftungsurkunde gehen die Erträge der Falkenstein-Stiftung ausschließlich an „leibliche Nachkommen Albrechts von Falkenstein“.
    category: motiv
  - id: in_geheimnis_vater
    title: Konstantins wahrer Vater
    text: "Henriettes verschlüsselte Zeile lautet: „Konstantins Vater ist Johann.“ – Dr. Johann Wiesinger."
    category: wendung
    characters: [konstantin, wiesinger]
  - id: in_folge_stiftung
    title: Wer verliert, wenn es herauskommt?
    text: Ist Konstantin nicht Albrechts Sohn, fallen er und sein Sohn Moritz aus der Stiftung. Moritz lebt ausschließlich von den Erträgen.
    category: motiv
    characters: [moritz, konstantin]
  - id: in_briefe_1971
    title: Die Briefe von 1971
    text: "Im Dachboden: Briefe von „J.“ an Henriette aus dem Jahr 1971. „Unser Sohn soll nie erfahren, wer ich bin.“"
    category: wendung
    characters: [wiesinger]
  - id: in_plektrum
    title: Ein Plektrum im Staub
    text: Neben dem geöffneten Briefkoffer auf dem Dachboden liegt ein Gitarrenplektrum. Die Staubspuren am Koffer sind frisch.
    category: spur
    characters: [moritz]
  - id: in_abdruck_moritz
    title: Der Fingerabdruck auf dem Blister
    text: Der Teilabdruck auf dem geleerten Blisterstreifen – Schleife rechts, drei Gabelungen, quer verlaufende Narbe – stammt von Moritz.
    category: identitaet
    characters: [moritz]
  - id: in_moritz_motiv
    title: „Dann sind Papa und ich raus“
    text: "Moritz an seine Freundin Jana, Freitag 16:42 Uhr: „Wenn das mit den Briefen rauskommt, sind Papa und ich raus aus der Stiftung. Alles weg.“"
    category: motiv
    characters: [moritz]
  - id: in_erledigt
    title: „Es ist erledigt“
    text: "Samstag, 23:10 Uhr, Moritz an Jana: „Es ist erledigt. Sie wird nichts sagen.“"
    category: wendung
    characters: [moritz]
    timeline: { time: "23:10", sort: 70, text: "Moritz schreibt: „Es ist erledigt. Sie wird nichts sagen.“" }
  - id: in_rede_keine_enthuellung
    title: Die Rede, die nie gehalten wurde
    text: Der halb verbrannte Redeentwurf zeigt – Henriette wollte die Wahrheit nie enthüllen. Sie wollte Konstantin am Montag ihr eigenes Vermögen schenken, damit er nie etwas verliert.
    category: wendung
    characters: [henriette]

