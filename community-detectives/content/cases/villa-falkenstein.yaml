solution:
  culprit: moritz
  headline: Moritz von Falkenstein – der Lieblingsenkel vergiftete seine Großmutter, um ein Geheimnis zu schützen, das sie nie verraten wollte.
  motive: Moritz belauschte am Freitag, wie Henriette zu Wiesinger sagte, sie werde „am Sonntag die Wahrheit sagen“. Kurz zuvor hatte er auf dem Dachboden die Briefe von 1971 gefunden. Er glaubte, sie werde enthüllen, dass Konstantin nicht Albrechts Sohn ist – dann wären Vater und Sohn aus der Stiftung gefallen, von der Moritz lebt. Tatsächlich meinte Henriette nur ihr Testament und wollte Konstantin ihr eigenes Vermögen schenken.
  method: Moritz drückte zwölf Digoxin-Tabletten aus der neuen Packung in der Küche, zerstieß sie und rührte sie um 21:30 Uhr in den allabendlichen Kakao. Danach spülte er die Tasse von Hand. Henriette zog sich um 22 Uhr in die Bibliothek zurück, schloss wie immer ab und spürte die ersten Symptome – Übelkeit, gelbe Höfe um die Kerzen. Sie starb in der Nacht allein an Kammerflimmern.
  summary: Das verschlossene Zimmer war kein Rätsel – Henriette hatte das Gift schon vorher getrunken. Gelbsehen und bitterer Geschmack verrieten Digoxin, die Obduktion bestätigte es. Aus der neuen Packung fehlten zwölf Tabletten, und auf dem Blister fand sich ein Abdruck mit der Narbe von Moritz' Gitarrensaite. Er brachte den Kakao, spülte die Tasse und schrieb um 23:10 „Es ist erledigt“.
  keyInsights: [in_digoxin, in_allein_eingeschlossen, in_kakao_giftraeger, in_tabletten_fehlen, in_abdruck_moritz, in_moritz_motiv]
  chain:
    - { insight: in_gelbsehen, explanation: "Gelbe Höfe um die Kerzen – ein klassisches Zeichen einer Digoxin-Vergiftung." }
    - { insight: in_digoxin, explanation: "Tagebuch und Beipackzettel zusammen entlarven den „natürlichen Tod“." }
    - { insight: in_allein_eingeschlossen, explanation: "Niemand war in der Bibliothek. Das Gift muss vor 22 Uhr verabreicht worden sein." }
    - { insight: in_kakao_giftraeger, explanation: "Der Kakao war bitter, und Moritz spülte die Tasse sofort – gegen jede Gewohnheit." }
    - { insight: in_tabletten_fehlen, explanation: "Zwölf Tabletten fehlten aus einer Packung, die noch niemand brauchte." }
    - { insight: in_abdruck_moritz, explanation: "Der Teilabdruck mit der Saitennarbe gehört Moritz." }
    - { insight: in_moritz_motiv, explanation: "Er glaubte, die Enthüllung würde ihn und seinen Vater aus der Stiftung werfen." }
    - { insight: in_rede_keine_enthuellung, explanation: "Die bittere Wahrheit: Henriette hatte nie vor, das Geheimnis preiszugeben." }
  truthTimeline:
    - { time: "Fr 13.06.", text: "Valerie bringt eine neue Packung Digoxin. Moritz findet auf dem Dachboden die Briefe von 1971." }
    - { time: "Fr 16:40", text: "Moritz belauscht Henriette: „Am Sonntag sage ich ihnen die Wahrheit.“" }
    - { time: "Sa 19:40", text: "Streit mit Konstantin. Henriette verspricht, seine Schulden zu bezahlen." }
    - { time: "Sa 21:20", text: "Moritz zerstößt zwölf Tabletten und macht den Kakao." }
    - { time: "Sa 21:30", text: "Henriette trinkt den bitteren Kakao im Salon." }
    - { time: "Sa 21:45", text: "Moritz spült die Tasse." }
    - { time: "Sa 22:00", text: "Henriette schließt sich in der Bibliothek ein." }
    - { time: "Sa 22:15", text: "Sie ruft Wiesinger an: Sie werde das Geheimnis mitnehmen. Ihr sei übel." }
    - { time: "Sa 23:10", text: "Moritz an Jana: „Es ist erledigt.“" }
    - { time: "So 01:00–03:00", text: "Henriette stirbt an Kammerflimmern." }
  redHerrings:
    - { character: konstantin, clue: "Schulden und ein lautstarker Streit", debunkedBy: in_konstantin_bezahlt, explanation: "Henriette wollte am Montag seine Schulden bezahlen – ihr Tod hat ihn das Geld gekostet." }
    - { character: valerie, clue: "Die Apothekerin brachte das Digoxin", debunkedBy: in_valerie_hotel, explanation: "Sie war ab 21:05 im Hotel. Der Kakao wurde um 21:30 getrunken." }
    - { character: paula, clue: "Sie stellt die Medikamente zusammen und erbt", debunkedBy: in_dosette_korrekt, explanation: "Die Dosette war korrekt. Das Gift kam aus der neuen Packung – über den Kakao." }
    - { character: wiesinger, clue: "Der vorschnelle Totenschein und das alte Geheimnis", debunkedBy: in_wiesinger_notdienst, explanation: "Er war den ganzen Abend im Notdienst und hatte keinen Zugang zum Kakao." }
    - { character: kraemer, clue: "Der einzige Zweitschlüssel", debunkedBy: in_zweitschluessel_versiegelt, explanation: "Die Plombe war unversehrt – und das verschlossene Zimmer spielt ohnehin keine Rolle." }
  epilogue: Moritz gestand noch am selben Abend. Konstantin erfuhr die Wahrheit über seine Herkunft aus dem Mund seines Sohnes. Der Stiftungsrat beschloss, die Frage nie offiziell zu prüfen. Dr. Wiesinger und Konstantin gehen seitdem jeden Sonntag gemeinsam am Rauhsee spazieren. Die Rede zum achtzigsten Geburtstag hat Krämer gerahmt.
