    summary: Der Verwalter hat ein Gedächtnis wie ein Uhrwerk.
    source: Polizei Seeberg
    unlock: { phase: familie }
    content:
      kind: document
      docType: statement
      heading: Zeugenaussage – Eduard Krämer, 63
      lines:
